<style>
:root{
  --paper:#f6f2ea; --card:#fffdf8; --ink:#1d2433; --ink2:#4a5263; --mute:#7c8393;
  --line:#e4ddcf; --line2:#d6cdbb; --seal:#b3261e; --seal-soft:#f6e2de; --navy:#24365c;
  --hl:#ffe9a8; --hl-ink:#3a2c00; --chip:#efe8da; --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 16px rgba(40,30,10,.05);
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang","바탕",serif;
  --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16181d; --card:#1e2128; --ink:#e8e4da; --ink2:#bfbab0; --mute:#8b8f99;
    --line:#2c3039; --line2:#3a3f4a; --seal:#e0574d; --seal-soft:#3a2321; --navy:#9db4e0;
    --hl:#5a4a12; --hl-ink:#fff1c2; --chip:#272b33; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#16181d; --card:#1e2128; --ink:#e8e4da; --ink2:#bfbab0; --mute:#8b8f99;
  --line:#2c3039; --line2:#3a3f4a; --seal:#e0574d; --seal-soft:#3a2321; --navy:#9db4e0;
  --hl:#5a4a12; --hl-ink:#fff1c2; --chip:#272b33; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.seal{width:32px;height:32px;border-radius:7px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:19px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{font-size:19px;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:-3px}
.bar .sp{flex:1}
.status{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#3a9a5b}
.dot.off{background:#c08a1e}
.iconbtn{border:1px solid var(--line2);background:var(--card);border-radius:9px;height:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn:hover{border-color:var(--ink2)}
.iconbtn svg{width:16px;height:16px}

/* search */
.hero{padding:22px 0 8px}
.search{position:relative}
.search input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 48px 0 46px;box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--navy)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .mag{position:absolute;left:15px;top:15px;width:22px;height:22px;color:var(--mute)}
.search .clr{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;background:transparent;color:var(--mute);border-radius:8px;display:none}
.search.has .clr{display:block}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hint{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.hint:hover{background:var(--chip)}

.tabs{display:flex;gap:4px;margin:18px 0 6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 12px;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--seal);font-weight:700}
.tab .n{font-size:11px;background:var(--chip);border-radius:999px;padding:1px 6px;margin-left:4px;color:var(--ink2)}

main{padding-bottom:80px}
.section-t{font-size:13px;color:var(--mute);font-weight:600;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.section-t::after{content:"";flex:1;height:1px;background:var(--line)}

/* law grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.lawcard{display:block;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.lawcard:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.lawcard .nm{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.lawcard .mt{font-size:12px;color:var(--mute);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.kind{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;background:var(--chip);color:var(--ink2);font-weight:600}
.kind.법률{background:var(--seal-soft);color:var(--seal)}
.new{font-size:11px;color:var(--seal);font-weight:700}

/* results */
.res{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:var(--line2)}
.res .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.res .ln{font-size:12px;color:var(--mute)}
.res .an{font-weight:700}
.res .sn{font-family:var(--serif);font-size:14px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:14px}
.empty .big{font-size:30px;margin-bottom:6px}
.note{font-size:13px;color:var(--ink2);background:var(--chip);border-radius:10px;padding:10px 12px;margin:10px 0}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}

/* law view */
.lawview{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding-top:18px}
.toc{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;font-size:13px;padding-right:6px}
.toc a{display:block;padding:3px 6px;border-radius:6px;color:var(--ink2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{background:var(--chip)}
.toc a.h{color:var(--ink);font-weight:700;margin-top:8px}
.lawhead{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
.back{border:0;background:transparent;color:var(--mute);font-size:13px;padding:0;margin-bottom:8px}
.lawhead h1{font-family:var(--serif);font-size:24px;margin:0;letter-spacing:-.02em;line-height:1.3}
.lawhead .mt{font-size:12.5px;color:var(--mute);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.tools{position:sticky;top:58px;z-index:10;background:var(--paper);display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input{height:34px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:9px;padding:0 10px;font:inherit;font-size:13.5px;outline:none}
.tools input:focus{border-color:var(--navy)}
.tools .jump{width:96px}
.tools .find{flex:1;min-width:120px}
.tools .cnt{font-size:12px;color:var(--mute);min-width:40px}
.hd{font-family:var(--serif);font-weight:800;font-size:calc(var(--fs) + 1px);margin:26px 0 6px;color:var(--ink);text-align:center;letter-spacing:.02em}
.art{padding:14px 0;border-bottom:1px dashed var(--line);scroll-margin-top:120px}
.art.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}
.art .ah{display:flex;align-items:baseline;gap:8px}
.art .ah .lb{font-weight:800;font-size:calc(var(--fs) + .5px);white-space:nowrap}
.art .ah .tt{font-weight:600;font-size:var(--fs);flex:1}
.art .acts{display:flex;gap:2px;opacity:.55}
.art:hover .acts,.art .acts .on{opacity:1}
.art .acts button{border:0;background:transparent;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink2)}
.art .acts button:hover{background:var(--chip)}
.art .acts button.on{color:var(--seal)}
.art .acts svg{width:16px;height:16px}
.art .body{font-family:var(--serif);font-size:var(--fs);line-height:1.85;margin-top:4px;color:var(--ink)}
.art .body p{margin:0}
.art .body .l2{padding-left:1.4em}
.art .body .l3{padding-left:2.6em}
.art .body .l4{padding-left:3.8em}
.art .body .amend{color:var(--mute);font-size:.86em}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:30px 0 10px;line-height:1.7}
.chg{border-left:3px solid var(--seal);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px;cursor:pointer}
.chg .d{font-size:12px;color:var(--mute)}

@media (max-width:760px){
  .lawview{grid-template-columns:minmax(0,1fr)}
  .toc{display:none;position:fixed;inset:58px 0 0 0;max-height:none;background:var(--paper);z-index:30;padding:14px 16px 40px;font-size:14px}
  .toc.open{display:block}
  .status .txt{display:none}
  .brand small{display:none}
  .lawhead h1{font-size:21px}
  .iconbtn .lbl{display:none}
  .tools{flex-wrap:nowrap;gap:5px}
  .tools .jump{width:64px;padding:0 8px}
  .tools .find{min-width:0}
  .tools .cnt{min-width:0}
  .tools .iconbtn{padding:0 8px}
}
@media (min-width:761px){ .tocbtn{display:none!important} }
@media print{ header.top,.tools,.toc,.acts,.back{display:none!important} .lawview{display:block} }
</style>

"제131조","title":"등기절차 및 사무","x":"제131조(등기절차 및 사무)"},{"t":"a","n":"제132조","title":"유한책임신탁의 청산","x":"제132조(유한책임신탁의 청산)"},{"t":"a","n":"제133조","title":"청산수탁자","x":"제133조(청산수탁자)"},{"t":"a","n":"제134조","title":"채권자의 보호","x":"제134조(채권자의 보호)"},{"t":"a","n":"제135조","title":"채권신고기간 내의 변제","x":"제135조(채권신고기간 내의 변제)"},{"t":"a","n":"제136조","title":"청산절차에서 채무의 변제","x":"제136조(청산절차에서 채무의 변제)"},{"t":"a","n":"제137조","title":"제외된 채권자에 대한 변제","x":"제137조(제외된 채권자에 대한 변제)"},{"t":"a","n":"제138조","title":"청산 중의 파산신청","x":"제138조(청산 중의 파산신청)"},{"t":"a","n":"제139조","title":"청산종결의 등기","x":"제139조(청산종결의 등기)"},{"t":"a","n":"제140조","title":"신탁사채권자집회의 대표자 등의 특별배임죄","x":"제140조(신탁사채권자집회의 대표자 등의 특별배임죄)"},{"t":"a","n":"제141조","title":"특별배임죄의 미수","x":"제141조(특별배임죄의 미수)"},{"t":"a","n":"제142조","title":"부실문서행사죄","x":"제142조(부실문서행사죄)"},{"t":"a","n":"제143조","title":"권리행사방해 등에 관한 증뢰ㆍ수뢰죄","x":"제143조(권리행사방해 등에 관한 증뢰ㆍ수뢰죄)"},{"t":"a","n":"제144조","title":"징역과 벌금의 병과","x":"제144조(징역과 벌금의 병과)"},{"t":"a","n":"제145조","title":"몰수ㆍ추징","x":"제145조(몰수ㆍ추징)"},{"t":"a","n":"제146조","title":"과태료","x":"제146조(과태료)"},{"t":"a","n":"제147조","title":"외부의 감사인 등의 의무위반행위","x":"제147조(외부의 감사인 등의 의무위반행위)\n특정 조문 조회: get_law_text(mst=\"198564\", jo=\"제XX조\")\n여러 조문 일괄 조회: get_batch_articles 도구 사용"}]},"004109":{"id":"004109","name":"신탁법 시행령","mst":"223781","kind":"대통령령","dept":"","promulgated":"20201208","effective":"20201210","fetched":"2026-11-11","source":"mcp","items":[{"t":"a","n":"제1조","title":"목적","x":"제1조(목적)\n이 영은 「신탁법」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다."},{"t":"a","n":"제2조","title":"신탁재산의 표시 방법","x":"제2조(신탁재산의 표시 방법)\n「신탁법」(이하 \"법\"이라 한다) 제4조제4항에서 \"대통령령으로 정하는 장부\"란 다음 각 호의 장부를 말한다. 이 경우 제2호의 건축물대장과 제4호의 토지대장 및 임야대장은 「공간정보의 구축 및 관리 등에 관한 법률」 제76조의3에 따른 부동산종합공부로 대체할 수 있다. \u003c개정 2014.1.17, 2015.6.1, 2018.2.9>\n1. 법 제79조제1항에 따른 수익자명부\n2. 「건축법」 제20조에 따른 가설건축물대장 및 같은 법 제38조에 따른 건축물대장\n3. 「상법」 제352조에 따른 주주명부 및 같은 법 제352조의2에 따른 전자주주명부\n4. 「공간정보의 구축 및 관리 등에 관한 법률」 제71조제1항에 따른 토지대장 및 임야대장\n5. 「도시개발법」 제2조제1항제2호에 따른 도시개발사업, 「농어촌정비법」 제2조제5호, 제10호 및 제18호에 따른 농업생산기반 정비사업, 생활환경정비사업 및 한계농지등의 정비사업, 「도시 및 주거환경정비법」 제2조제2호가목 및 나목에 따른 주거환경개선사업 및 재개발사업 등 법령에 따른 환지(換地) 방식의 사업을 할 때 환지, 체비지(替費地) 및 보류지(保留地)의 관리를 위하여 작성ㆍ관리하는 장부"},{"t":"a","n":"제3조","title":"신탁사무와 관련된 서류의 보존기간 등","x":"제3조(신탁사무와 관련된 서류의 보존기간 등)\n① 법 제39조제3항에서 \"대통령령으로 정하는 기간\"이란 다음 각 호의 구분에 따른 기간을 말한다.\n1. 신탁의 재산목록과 그 부속 명세서, 재무제표와 그 부속 명세서 및 신탁재산의 운용 내역서: 해당 신탁이 종료된 때부터 10년\n2. 제1호에 규정되지 아니한 서류: 해당 신탁이 종료된 때부터 5년\n② 법 제39조제4항에 따라 신탁사무와 관련된 장부, 재산목록 및 그 밖의 서류를 보존하는 경우에는 다음 각 호의 구분에 따른 방법으로 한다. 이 경우 마이크로필름의 형태로 보관하거나 전산정보처리조직에 의하여 보존할 수 있다.\n1. 신탁의 재산목록과 그 부속 명세서, 재무제표와 그 부속 명세서 및 신탁재산의 운용 내역서: 수탁자의 사무소ㆍ영업소 또는 법 제114조에 따른 유한책임신탁(이하 \"유한책임신탁\"이라 한다)의 신탁사무를 처리하는 주된 사무소(이하 \"신탁사무처리지\"라 한다)에 비치ㆍ보관\n2. 제1호에 규정되지 아니한 서류: 수탁자의 사무소ㆍ영업소(수탁자를 위하여 해당 서류를 보관하는 자의 사무소ㆍ영업소를 포함한다) 또는 유한책임신탁의 신탁사무처리지에 보관"},{"t":"a","n":"제4조","title":"수익자집회 소집 시 제공할 서류","x":"제4조(수익자집회 소집 시 제공할 서류)\n법 제72조제6항에서 \"대통령령으로 정하는 서류\"란 다음 각 호의 구분에 따른 사항을 적은 서류를 말한다.\n1. 수익자집회에서 수탁자, 신탁재산관리인 또는 신탁관리인을 선임하려는 경우에는 다음 각 목의 사항\n가. 수탁자, 신탁재산관리인 또는 신탁관리인 후보자의 성명 또는 명칭\n나. 수탁자, 신탁재산관리인 또는 신탁관리인 후보자의 경력\n다. 후보 추천 사유\n라. 신탁관리인 후보자가 수탁자 또는 수탁자 후보자와 공정한 업무 수행에 영향을 미칠 특별한 이해관계가 있는 경우에는 그 내용\n2. 수익자집회에서 수탁자, 신탁재산관리인 또는 신탁관리인을 해임하려는 경우에는 다음 각 목의 사항\n가. 해임하려는 수탁자, 신탁재산관리인 또는 신탁관리인의 성명 또는 명칭\n나. 해임 사유\n3. 법 제55조제2항 또는 제103조제1항에 따라 신탁사무에 관한 계산(이하 이 호에서 \"신탁계산\"이라 한다)을 승인하려는 경우에는 다음 각 목의 사항\n가. 신탁계산의 내용 및 결과\n나. 법 제117조제2항에 따라 외부감사를 받았을 때에는 감사인이 작성한 감사보고서\n4. 법 제88조에 따라 신탁을 변경하려는 경우에는 다음 각 목의 사항\n가. 신탁변경의 이유 및 내용\n나. 신탁변경의 효력발생일\n다. 신탁변경으로 인하여 수익권 또는 수익채권의 내용에 변경이 있거나 그 가치에 중대한 영향을 줄 우려가 있을 때에는 그 내용 및 적절성에 관한 사항\n5. 법 제90조에 따라 신탁을 합병하려는 경우에는 법 제91조제1항 각 호의 사항\n6. 법 제94조제1항에 따라 신탁을 분할하거나 같은 조 제2항에 따라 신탁을 분할합병하려는 경우에는 법 제95조제1항 각 호의 사항\n7. 법 제99조제1항에 따라 합의하여 신탁을 종료하려는 경우에는 다음 각 목의 사항\n가. 신탁 종료의 이유\n나. 신탁재산의 잔여재산이 있는 경우에는 그 내용 및 잔여재산수익자 또는 신탁재산의 잔여재산이 귀속될 자(이하 \"귀속권리자\"라 한다)\n8. 제1호부터 제7호까지의 사항 외의 사항에 관한 안건을 목적으로 하려는 경우에는 해당 안건의 내용과 제안 이유에 대한 설명"},{"t":"a","n":"제5조","title":"전자문서에 의한 의결권의 행사","x":"제5조(전자문서에 의한 의결권의 행사)\n① 법 제73조제3항에 따라 수익자가 전자문서로 의결권을 행사(이하 \"전자투표\"라 한다)하는 경우 수익자의 확인과 의결권의 행사는 「전자서명법」 제2조제2호에 따른 전자서명(서명자의 실지명의를 확인할 수 있는 것으로 한정한다)을 통하여 하여야 한다. \u003c개정 2020.12.8>\n② 수익자의 전자투표를 승낙한 수익자집회 소집자(이하 \"소집자\"라 한다)는 소집의 통지나 공고에 다음 각 호의 사항을 적어야 한다.\n1. 전자투표를 할 인터넷 주소\n2. 전자투표를 할 기간(전자투표의 종료일은 수익자집회 전날까지로 한다)\n3. 그 밖에 수익자의 전자투표에 필요한 기술적인 사항\n③ 전자투표를 한 수익자는 해당 수익권에 대하여 그 의결권 행사를 철회하거나 변경하지 못한다.\n④ 소집자는 전자투표의 효율성 및 공정성을 확보하기 위하여 전자투표를 관리하는 기관을 지정하여 수익자 확인절차 등 의결권 행사절차의 운영을 위탁할 수 있다.\n⑤ 소집자, 제4항에 따라 지정된 전자투표를 관리하는 기관 및 전자투표의 운영을 담당하는 자는 수익자집회에서의 개표 시까지 전자투표의 결과를 누설하거나 직무상 목적 외에 사용해서는 아니 된다."},{"t":"a","n":"제6조","title":"수익증권의 기재사항","x":"제6조(수익증권의 기재사항)\n법 제78조제5항제9호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 신탁기간의 정함이 있는 경우에는 그 기간\n2. 법 제47조제1항에 따라 수탁자에게 보수를 지급하는 경우에는 수탁자 보수의 계산방법, 지급방법 및 지급시기\n3. 기명수익증권을 발행한 경우로서 수익권에 대한 양도의 제한이 있을 때에는 그 취지 및 내용\n4. 법 제101조제1항에 따라 신탁이 종료되었을 때에 잔여재산수익자 또는 귀속권리자를 정한 경우에는 그 성명 또는 명칭\n5. 유한책임신탁인 경우에는 신탁사무처리지"},{"t":"a","n":"제7조","title":"수익자명부의 기재사항","x":"제7조(수익자명부의 기재사항)\n법 제79조제1항제7호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 위탁자의 성명 또는 명칭 및 주소\n2. 수탁자의 성명 또는 명칭 및 주소\n3. 법 제17조제1항 및 제18조제1항ㆍ제2항에 따라 신탁재산관리인을 선임한 경우에는 그 성명 또는 명칭 및 주소\n4. 법 제67조제1항부터 제3항까지의 규정에 따라 신탁관리인을 선임한 경우에는 그 성명 또는 명칭 및 주소\n5. 법 제78조제1항 후단에 따라 특정 내용의 수익권에 대하여 수익증권을 발행하지 아니한다는 뜻을 정한 경우에는 그 내용\n6. 법 제79조제4항에 따라 수익자명부관리인을 정한 경우에는 그 성명 또는 명칭 및 주소\n7. 법 제80조제1항 단서에 따라 수익증권의 불소지 신고를 허용하지 아니하기로 정한 경우에는 그 취지\n8. 기명수익증권을 발행한 경우 수익권에 대한 양도의 제한이 있을 때에는 그 취지 및 내용\n9. 법 제83조제3항에 따라 질권이 설정된 경우에는 질권자의 성명 또는 명칭 및 주소와 질권의 목적인 수익권\n10. 수익권에 대하여 신탁이 설정된 경우에는 신탁재산이라는 뜻\n11. 유한책임신탁인 경우에는 그 뜻과 신탁의 명칭"},{"t":"a","n":"제8조","title":"사채 총액의 한도","x":"제8조(사채 총액의 한도)\n법 제87조제3항에 따른 사채(社債) 총액의 한도는 최종의 대차대조표에 의하여 유한책임신탁에 현존하는 순자산액의 4배로 한다. 다만, 최종의 대차대조표가 없는 경우에는 사채의 발행 시점에 유한책임신탁에 현존하는 순자산액의 4배로 한다."},{"t":"a","n":"제9조","title":"합병계획서의 기재사항","x":"제9조(합병계획서의 기재사항)\n법 제91조제1항제6호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 합병할 각 신탁의 위탁자의 성명 또는 명칭 및 주소\n2. 합병할 각 신탁의 수탁자의 성명 또는 명칭 및 주소\n3. 합병할 각 신탁의 신탁행위의 내용 및 설정일\n4. 합병할 각 신탁의 신탁재산의 목록 및 내용\n5. 합병할 각 신탁이 유한책임신탁인 경우에는 그 명칭 및 신탁사무처리지"},{"t":"a","n":"제10조","title":"합병의 공고ㆍ최고 사항","x":"제10조(합병의 공고ㆍ최고 사항)\n법 제92조제1항제3호에서 \"대통령령으로 정하는 사항\"이란 합병 후 신탁채무의 이행 계획을 말한다."},{"t":"a","n":"제11조","title":"분할계획서ㆍ분할합병계획서의 기재사항","x":"제11조(분할계획서ㆍ분할합병계획서의 기재사항)\n법 제95조제1항제8호에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 분할된 신탁과 분할 후 신설신탁 또는 분할합병신탁의 위탁자의 성명 또는 명칭 및 주소\n2. 분할된 신탁과 분할 후 신설신탁 또는 분할합병신탁의 수탁자의 성명 또는 명칭 및 주소\n3. 분할된 신탁과 분할 후 신설신탁 또는 분할합병신탁이 유한책임신탁인 경우에는 그 명칭 및 신탁사무처리지"},{"t":"a","n":"제12조","title":"분할ㆍ분할합병의 공고ㆍ최고 사항","x":"제12조(분할ㆍ분할합병의 공고ㆍ최고 사항)\n법 제96조제1항제3호에서 \"대통령령으로 정하는 사항\"이란 분할 또는 분할합병 후 신탁채무의 이행 계획을 말한다."},{"t":"a","n":"제13조","title":"유한책임신탁의 신탁행위로 정할 사항","x":"제13조(유한책임신탁의 신탁행위로 정할 사항)\n법 제114조제2항제6호에서 \"대통령령으로 정하는 사항\"이란 신탁의 사업연도를 말한다."},{"t":"a","n":"제14조","title":"유한책임신탁의 회계서류 등","x":"제14조(유한책임신탁의 회계서류 등)\n① 법 제117조제1항제4호에서 \"대통령령으로 정하는 회계서류\"란 다음 각 호의 서류를 말한다.\n1. 자본변동표\n2. 신탁의 재산목록과 그 부속 명세서\n3. 법 제78조제1항에 따라 수익증권을 발행하는 경우에는 수익증권기준가격 계산서\n② 법 제117조제2항제2호에서 \"대통령령으로 정하는 기준 이상\"이란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n1. 자산총액이 100억원 이상인 경우\n2. 부채총액이 70억원 이상이고 자산총액이 70억원 이상인 경우"},{"t":"a","n":"제15조","title":"유한책임신탁의 수익자에 대한 급부가 가능한 한도","x":"제15조(유한책임신탁의 수익자에 대한 급부가 가능한 한도)\n① 법 제120조제2항에 따른 급부가 가능한 한도는 급부를 할 날이 속하는 사업연도의 직전 사업연도 말일의 순자산액에서 신탁행위로 정한 유보액과 급부를 할 날이 속하는 사업연도에 이미 급부한 신탁재산의 가액(價額)을 공제한 금액을 말한다.\n② 제1항을 적용할 때 유한책임신탁의 수익권이 그 유한책임신탁의 신탁재산에 속하게 된 경우에는 그 수익권은 해당 유한책임신탁의 순자산으로 계산하지 아니한다."},{"t":"a","n":"제16조","title":"유한책임신탁등기의 기재사항","x":"제16조(유한책임신탁등기의 기재사항)\n법 제126조제1항제6호에서 \"대통령령으로 정하는 사항\"이란 신탁행위로 정한 종료 사유가 있는 경우 그 종료 사유를 말한다."},{"t":"a","n":"제17조","title":"과태료의 부과기준","x":"제17조(과태료의 부과기준)\n법무부장관은 법 제146조에 따른 과태료의 금액을 정하는 경우 해당 위반행위의 동기와 그 결과, 위반기간 및 위반 정도 등을 고려하여야 한다."}]},"010513":{"id":"010513","name":"자본시장과 금융투자업에 관한 법률","mst":"288615","kind":"법률","dept":"","promulgated":"20260804","effective":"20261002","fetched":"2026-11-11","source":"mcp","items":[{"t":"a","n":"제1조","title":"목적","x":"제1조(목적)"},{"t":"a","n":"제2조","title":  분양받는 자를 보호하고 국민경제의 건전한 발전에 이바지함을 목적으로 한다."},{"t":"a","n":"제2조","title":"정의","x":"제2조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다. \u003c개정 2012.6.1>\n1. \"건축물\"이란 「건축법」 제2조제1항제2호의 건축물을 말한다.\n2. \"분양\"이란 분양사업자가 건축하는 건축물의 전부 또는 일부를 2인 이상에게 판매하는 것을 말한다. 다만, 「건축법」 제2조제2항에 따른 건축물의 용도 중 둘 이상의 용도로 사용하기 위하여 건축하는 건축물을 판매하는 경우 어느 하나의 용도에 해당하는 부분의 바닥면적이 제3조제1항제1호에서 정한 규모 이상에 해당하고 그 부분의 전부를 1인에게 판매하는 것은 제외한다.\n3. \"분양사업자\"란 「건축법」 제2조제1항제12호의 건축주로서 건축물을 분양하는 자를 말한다.\n4. \"분양받은 자\"란 제6조제3항부터 제5항까지의 규정에 따라 분양사업자와 건축물의 분양계약을 체결한 자를 말한다."},{"t":"a","n":"제3조","title":"적용 범위","x":"제3조(적용 범위)\n① 이 법은 「건축법」 제11조에 따른 건축허가를 받아 건축하여야 하는 다음 각 호의 어느 하나에 해당하는 건축물로서 같은 법 제22조에 따른 사용승인서의 교부(이하 \"사용승인\"이라 한다) 전에 분양하는 건축물에 대하여 적용한다.\n1. 분양하는 부분의 바닥면적(「건축법」 제84조에 따른 바닥면적을 말한다)의 합계가 3천제곱미터 이상인 건축물\n2. 업무시설 등 대통령령으로 정하는 용도 및 규모의 건축물\n② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 건축물에 대하여는 이 법을 적용하지 아니한다. \u003c개정 2012.6.1>\n1. 「주택법」에 따른 주택 및 복리시설\n2. 「산업집적활성화 및 공장설립에 관한 법률」에 따른 지식산업센터\n3. 「관광진흥법」에 따른 관광숙박시설\n4. 「노인복지법」에 따른 노인복지시설\n5. 「공공기관의 운영에 관한 법률」에 따른 공공기관이 매입하는 업무용 건축물\n6. 「지방공기업법」에 따른 지방공기업이 매입하는 업무용 건축물\n③ 제2조제2호 단서 및 제2항에도 불구하고 제2조제2호 단서에 따라 분양에 해당하지 아니하는 방법으로 매입한 건축물과 제2항제5호 및 제6호에 해당하는 건축물의 전매 또는 전매 알선에 대하여는 제6조의3제3항 및 제10조제2항제5호를 적용한다. \u003c신설 2012.6.1>"},{"t":"a","n":"제4조","title":"분양 시기 등","x":"제4조(분양 시기 등)\n① 분양사업자는 다음 각 호의 구분에 따라 건축물을 분양하여야 한다.\n1. 「자본시장과 금융투자업에 관한 법률」에 따른 신탁업자와 신탁계약 및 대리사무계약을 체결한 경우 또는 금융기관 등으로부터 분양보증을 받는 경우: 「건축법」 제21조에 따른 착공신고 후\n2. 해당 건축물의 사용승인에 대하여 다른 건설업자 둘 이상의 연대보증을 받아 공증받은 경우: 골조공사의 3분의 2 이상이 완료된 후\n② 제1항제1호의 적용과 관련하여 신탁회사가 분양사업자로 되는 신탁계약이 체결된 경우에는 착공신고 후 분양을 위한 별도의 신탁계약이 필요하지 아니하다.\n③ 제1항제1호에서 \"분양보증\"이란 분양사업자가 파산 등의 사유로 분양계약을 이행할 수 없게 되는 경우 해당 건축물의 분양(사용승인을 포함한다)의 이행이나 납부한 분양대금의 환급(분양받은 자가 원하는 경우로 한정한다)을 책임지는 보증을 말한다.\n④ 제1항제1호에 따른 신탁계약ㆍ대리사무계약의 방법과 기준, 분양보증을 할 수 있는 금융기관 등의 종류 및 범위는 대통령령으로 정한다.\n⑤ 제1항제2호에서 \"다른 건설업자\"란 「건설산업기본법」 제2조제7호에 따른 건설사업자로서 대통령령으로 정하는 건설업자를 말한다. \u003c개정 2011.5.24, 2019.4.30>\n⑥ 분양사업자는 건축물을 분양하려는 경우에는 건축할 대지(垈地)의 소유권을 확보하여야 한다. 다만, 건축할 대지의 소유권이 국가 또는 지방자치단체에 있거나 그 밖에 대통령령으로 정하는 경우에는 그러하지 아니하다.\n⑦ 분양사업자는 제6항에 따라 소유권을 확보한 대지에 저당권, 가등기담보권, 전세권, 지상권 및 등기되어 있는 부동산임차권이 설정되어 있는 경우에는 이를 말소하여야 한다. 다만, 분양사업자가 국가 또는 지방자치단체인 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다."},{"t":"a","n":"제5조","title":"분양신고","x":"제5조(분양신고)\n① 분양사업자는 건축물을 분양하려는 경우에는 「건축법」 제11조에 따른 허가권자(이하 \"허가권자\"라 한다)에게 신고하여야 한다.\n② 분양사업자는 제1항에 따라 분양신고를 할 때에는 신탁계약서, 대리사무계약서, 대지의 등기사항증명서 등 대통령령으로 정하는 서류를 갖추어 허가권자에게 제출하여야 한다. 다만, 허가권자가 「전자정부법」 제36조제1항에 따라 행정정보의 공동이용을 통하여 확인한 서류의 경우에는 그러하지 아니하다. \u003c개정 2011.4.12>\n③ 허가권자는 분양신고의 내용을 검토하여 이 법에 적합한 경우에는 분양신고를 수리(受理)하고 그 사실을 분양사업자에게 통보하여야 한다."},{"t":"a","n":"제6조","title":"분양방법 등","x":"제6조(분양방법 등)\n① 분양사업자는 제5조제3항에 따른 분양신고의 수리 사실을 통보받은 후에 분양 광고에 따라 분양받을 자를 공개모집하여야 한다. 이 경우 대통령령으로 정하는 용도 및 규모의 건축물에 대해서는 인터넷을 활용하여 분양받을 자를 공개모집하여야 한다. \u003c개정 2017.10.24>\n② 제1항에 따른 분양 광고에는 건축물의 위치ㆍ용도ㆍ규모 및 내진설계 등 대통령령으로 정하는 사항이 포함되어야 한다. \u003c개정 2017.4.18>\n③ 분양사업자는 제1항에 따른 분양 광고에 따라 분양신청을 한 자 중에서 공개추첨의 방법으로 분양받을 자를 선정하여야 한다.\n④ 분양사업자는 제3항에 따라 분양받을 자로 선정된 자와 분양계약을 체결하여야 하며, 분양계약서에는 분양 건축물의 표시(공용부분의 위치ㆍ규모를 포함한다), 신탁계약ㆍ대리사무계약 또는 분양보증계약의 종류, 신탁업자 또는 분양보증기관의 명칭 등 분양계약의 체결에 영향을 줄 수 있는 사항으로서 대통령령으로 정하는 사항이 포함되어야 한다. \u003c개정 2019.8.20>\n⑤ 제3항에 따라 분양받을 자를 선정하고 남은 부분이 있거나 제4항에 따라 분양계약을 체결하고 남은 부분이 있는 경우에는 그 남은 부분에 대하여 분양받을 자를 선정할 때에는 대통령령으로 정하는 방법으로 한다. 이 경우 분양받을 자로 선정된 자와의 분양계약 체결에 관하여는 제4항을 적용한다.\n⑥ 제1항에 따른 공개모집의 절차, 방법 등에 필요한 사항은 대통령령으로 정한다. \u003c신설 2017.10.24>"},{"t":"a","n":"제6조의2","title":"거주자 우선 분양","x":"제6조의2(거주자 우선 분양)\n① 분양사업자는 「주택법」 제63조제1항에 따라 지정된 투기과열지구 또는 같은 법 제63조의2제1항제1호에 따라 지정된 조정대상지역에서 건축물을 분양하려는 경우에는 분양분의 100분의 20의 범위에서 대통령령으로 정하는 바에 따라 분양 신고일 현재 그 건축물 건설지역의 거주자(주된 사무소의 소재지가 있는 법인을 포함한다. 이하 같다)로서 분양을 신청한 자 중에서 분양받을 자를 우선 선정하여야 한다. 이 경우 분양사업자는 분양 광고에 이를 밝혀야 한다. \u003c개정 2016.1.19, 2017.10.24>\n② 제1항은 제6조제1항에 따라 최초 공개모집이 이루어진 경우에만 적용한다."},{"t":"a","n":"제6조의3","title":"분양 건축물의 전매행위 제한","x":"제6조의3(분양 건축물의 전매행위 제한)\n① 「주택법」 제63조제1항에 따라 지정된 투기과열지구 또는 같은 법 제63조의2제1항제1호에 따라 지정된 조정대상지역에서 대통령령으로 정하는 용도 및 규모의 건축물을 분양받은 자 또는 소유자는 분양계약을 체결한 날부터 사용승인 후 1년의 범위에서 대통령령으로 정하는 기간에는 분양받은 자의 지위 또는 건축물을 전매(매매, 증여, 그 밖에 권리가 변동되는 모든 행위를 포함하되 상속은 제외한다. 이하 같다)하거나 이의 전매를 알선할 수 없다. 이 경우 전매제한 기간은 행정구역, 「주택법」 제63조제1항에 따라 지정되는 투기과열지구 또는 같은 법 제63조의2제1항제1호에 따라 지정되는 조정대상지역 등을 고려하여 대통령령으로 다르게 정할 수 있다. \u003c개정 2016.1.19, 2017.10.24>\n② 제1항에 해당하지 아니하는 건축물로서 분양사업자와 분양받은 자가 제6조제4항에 따른 분양계약 체결을 한 건축물의 경우에는 사용승인 전에 2명 이상에게 전매하거나 이의 전매를 알선할 수 없다.\n③ 제2조제2호 단서에 따라 분양에 해당하지 아니하는 방법으로 매입한 건축물과 제3조제2항제5호 및 제6호에 해당하는 건축물의 경우에는 사용승인 전에 2인 이상에게 전매하거나 이의 전매를 알선할 수 없다. \u003c신설 2012.6.1>"},{"t":"a","n":"제6조의4","title":"분양 건축물의 계약 취소","x":"제6조의4(분양 건축물의 계약 취소)\n허가권자 또는 분양사업자는 다음 각 호의 어느 하나에 해당하는 경우에는 분양받은 자와의 계약을 취소할 수 있다.\n1. 제6조의2제1항에 따른 분양을 거짓이나 그 밖의 부정한 방법으로 받은 경우\n2. 제6조의3제1항 또는 제2항을 위반하여 전매한 경우"},{"t":"a","n":"제7조","title":"설계의 변경","x":"제7조(설계의 변경)\n① 분양사업자는 분양한 건축물에 대하여 사용승인 전에 건축물의 면적ㆍ층수의 증감(增減) 또는 용도의 변경 등 분양받은 자의 이해관계에 중대한 영향을 줄 수 있는 설계변경으로서 대통령령으로 정하는 설계변경을 하려는 경우에는 분양받은 자의 5분의 4 이상의 동의를 받아야 한다. 이 경우 동의한 자가 분양받은 전용면적의 합이 분양된 전체 전용면적의 3분의 2 이상이어야 한다. \u003c개정 2025.12.2>\n② 분양사업자는 제1항에 따른 설계변경에 해당하지 아니하는 설계변경으로서 국토교통부령으로 정하는 설계변경을 하려는 경우에는 미리 그 내용을 분양받은 자 전원에게 알려야 한다. \u003c개정 2013.3.23>\n③ 제1항과 제2항에 따른 동의 및 통보의 시기, 절차, 그 밖에 필요한 사항은 국토교통부령으로 정한다. \u003c개정 2013.3.23>"},{"t":"a","n":"제7조의2","title":"설계의 변경에 따른 분양계약의 해제","x":"제7조의2(설계의 변경에 따른 분양계약의 해제)\n제7조제1항에 따른 설계의 변경에 동의하지 아니한 자로서 설계의 변경으로 인하여 다른 법령에 따른 인가ㆍ허가ㆍ면허 등을 받거나 등록ㆍ신고를 할 수 없게 되어 건축물을 제6조제1항에 따른 분양 광고에 포함된 용도대로 사용하지 못하게 된 자는 분양계약을 해제할 수 있다."},{"t":"a","n":"제8조","title":"분양대금의 납입","x":"제8조(분양대금의 납입)\n① 분양사업자가 분양받은 자로부터 받는 분양대금은 계약금ㆍ중도금 및 잔금으로 구분한다.\n② 제1항에 따른 계약금ㆍ중도금 및 잔금의 비율과 이를 받을 수 있는 시기는 대통령령으로 정한다."},{"t":"a","n":"제8조의2","title":"분양 관련 정보의 종합관리","x":"제8조의2(분양 관련 정보의 종합관리)\n① 국토교통부장관 또는 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사ㆍ특별자치도지사(이하 이 조에서 \"국토교통부장관등\"이라 한다)는 건축물 분양에 관한 정책의 수립 및 시행을 위하여 분양신고의 내용, 분양 현황 등 건축물의 분양과 관련된 정보를 종합적으로 관리하고 이를 관련 기관ㆍ단체 등에 제공할 수 있다.\n② 국토교통부장관등은 제1항에 따라 건축물의 분양과 관련된 정보를 종합적으로 관리하기 위하여 분양 현황 등 필요한 자료를 대통령령으로 정하는 바에 따라 허가권자, 분양사업자 및 관련 기관ㆍ단체 등에 요청할 수 있다. 이 경우 요청을 받은 허가권자, 분양사업자 및 관련 기관ㆍ단체 등은 특별한 사유가 없으면 요청에 따라야 한다.\n③ 국토교통부장관은 제1항과 제2항에 따른 정보를 체계적으로 관리하기 위하여 대통령령으로 정하는 바에 따라 건축물 분양 정보관리체계를 구축ㆍ운영할 수 있다.\n④ 국토교통부장관은 제3항에 따른 건축물 분양 정보관리체계의 구축ㆍ운영을 대통령령으로 정하는 기관ㆍ단체에 위탁할 수 있다."},{"t":"a","n":"제9조","title":"시정명령","x":"제9조(시정명령)\n① 허가권자는 분양사업자의 분양 광고의 내용이 제5조제3항에 따라 수리된 분양신고의 내용과 다르거나 제6조제2항에 따른 사항을 포함하지 아니하였다고 인정되는 경우에는 즉시 분양사업자에게 시정을 명하고, 그 사실을 해당 허가권자가 운영하는 정보통신망에 공표하여야 한다.\n② 분양사업자는 제1항에 따른 시정명령을 받은 경우에는 시정명령을 받은 날부터 10일 이내에 시정명령을 받은 내용과 정정할 사항을 대통령령으로 정하는 방법으로 공표하여야 한다.\n③ 분양사업자는 제2항에 따른 시정명령을 이행하기 전에 제6조에 따라 분양받을 자를 선정하였거나 분양계약을 체결하였을 때에는 분양받을 자로 선정된 자 또는 분양받은 자에게 제2항에 따른 공표 내용을 알려야 한다."},{"t":"a","n":"제9조의2","title":"보고 및 감독","x":"제9조의2(보고 및 감독)\n① 국토교통부장관, 특별시장, 광역시장 또는 도지사는 허가권자에게 분양사업자의 분양신고 등과 관련하여 필요한 자료 제출이나 보고를 요구할 수 있다. \u003c개정 2013.3.23, 2020.2.18>\n② 허가권자는 제1항에 따른 자료 제출이나 보고를 요구받은 경우에는 특별한 사유가 없으면 그 요구에 따라야 한다.\n③ 국토교통부장관(특별시장, 광역시장, 특별자치시장 또는 특별자치도지사의 명령이나 처분에 한정한다), 특별시장, 광역시장 또는 도지사는 허가권자가 한 명령이나 처분이 이 법에 위반된다고 인정하는 경우에는 그 명령 또는 처분의 취소ㆍ변경이나 그 밖에 필요한 조치를 명할 수 있다. \u003c개정 2013.3.23, 2020.2.18>\n④ 제3항에 따른 필요한 조치명령을 받은 허가권자는 그 시정 결과 등을 국토교통부장관, 특별시장, 광역시장 또는 도지사에게 지체 없이 보고하여야 한다. \u003c개정 2013.3.23, 2020.2.18>"},{"t":"a","n":"제9조의3","title":"조사 및 검사 등","x":"제9조의3(조사 및 검사 등)\n① 국토교통부장관 또는 허가권자는 분양사업자에게 이 법의 시행에 필요한 자료의 제출과 보고를 요구할 수 있으며, 소속 공무원으로 하여금 해당 사무소에 출입하여 장부ㆍ대장, 그 밖의 서류를 조사 또는 검사하게 할 수 있다.\n② 제1항에 따라 출입ㆍ검사 등을 하는 공무원은 그 권한을 표시하는 증표를 지니고 이를 관계인에게 내보여야 한다."},{"t":"a","n":"제10조","title":"벌칙","x":"제10조(벌칙)\n① 제5조제1항에 따른 분양신고를 하지 아니하거나, 거짓이나 그 밖의 부정한 방법으로 분양신고를 하고 건축물을 분양한 자는 3년 이하의 징역 또는 3억원 이하의 벌금에 처한다.\n② 다음 각 호의 어느 하나에 해당하는 자는 1년 이하의 징역 또는 1억원 이하의 벌금에 처한다. \u003c개정 2012.6.1, 2017.10.24, 2025.12.2>\n1. 제6조제1항을 위반하여 분양신고의 수리 사실을 통보받지 아니하고 분양 광고를 하거나 공개모집이 아닌 방법으로 분양받을 자를 모집하거나 인터넷을 활용하여 모집하여야 하는 용도 및 규모의 건축물임에도 불구하고 인터넷을 활용하지 아니하고 분양받을 자를 공개모집한 자\n2. 제6조제3항을 위반하여 공개추첨의 방법에 따르지 아니하고 분양받을 자를 선정한 자\n3. 제6조제4항 또는 제5항 후단을 위반하여 분양계약을 체결한 자\n4. 제6조의2제1항을 위반하여 분양하거나 분양 광고를 한 분양사업자\n5. 제6조의3제1항부터 제3항까지의 규정을 위반하여 전매한 자 및 이의 전매를 알선한 자\n6. 제7조제1항 또는 제2항을 위반하여 설계변경에 필요한 요건을 갖추지 아니하고 설계변경을 한 자\n③ 삭제 \u003c2017.10.24>"},{"t":"a","n":"제11조","title":"양벌규정","x":"제11조(양벌규정)\n법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제10조제1항 또는 제2항의 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 해당 조문의 벌금형을 과(科)한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다."},{"t":"a","n":"제12조","title":"과태료","x":"제12조(과태료)\n① 다음 각 호의 어느 하나에 해당하는 자에게는 1억원 이하의 과태료를 부과한다.\n1. 제8조를 위반하여 분양대금을 받은 자\n2. 제9조제2항 또는 제3항을 위반하여 공표하지 아니하거나 공표 내용을 알리지 아니한 분양사업자\n② 제9조의3제1항에 따른 자료의 제출ㆍ보고를 하지 아니하거나 거짓으로 제출ㆍ보고하거나 조사 또는 검사를 거부ㆍ방해 또는 기피한 자에게는 500만원 이하의 과태료를 부과한다. \u003c신설 2017.10.24>\n③ 제1항 및 제2항에 따른 과태료는 대통령령으로 정하는 바에 따라 국토교통부장관 또는 허가권자가 부과ㆍ징수한다. \u003c개정 2017.10.24>"}]},"009944":{"id":"009944","name":"건축물의 분양에 관한 법률 시행령","mst":"285171","kind":"대통령령","dept":"","promulgated":"20260331","effective":"20260403","fetched":"2026-11-11","source":"mcp","items":[{"t":"a","n":"제1조","title":"목적","x":"제1조(목적)\n이 영은 「건축물의 분양에 관한 법률」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다."},{"t":"a","n":"제2조","title":"적용 범위","x":"제2조(적용 범위)\n「건축물의 분양에 관한 법률」(이하 \"법\"이라 한다) 제3조제1항제2호에서 \"대통령령으로 정하는 용도 및 규모\"란 분양하려는 부분의 용도 및 규모가 다음 각 호의 어느 하나에 해당하는 것을 말한다. \u003c개정 2014.12.3, 2019.10.8, 2021.11.2>\n1. 「건축법 시행령」 별표 1 제14호나목2)에 따른 오피스텔(이하 \"오피스텔\"이라 한다)로서 30실(室) 이상인 것\n2. 「건축법 시행령」 별표 1 제15호가목에 따른 생활숙박시설(이하 \"생활숙박시설\"이라 한다)로서 30실 이상이거나 생활숙박시설 영업장의 면적이 해당 건축물 연면적의 3분의 1 이상인 것\n3. 주택 외의 시설과 주택을 동일 건축물로 짓는 건축물 중 주택 외의 용도로 쓰이는 바닥면적(「건축법 시행령」 제119조제1항제3호에 따라 산정(算定)한 바닥면적을 말한다. 이하 같다)의 합계가 3천제곱미터 이상인 것\n4. 바닥면적의 합계가 3천제곱미터 이상으로서 임대 후 분양전환을 조건으로 임대하는 것(분양전환 시 임차인에게 우선순위를 부여하는 것을 포함한다)"},{"t":"a","n":"제3조","title":"신탁계약 및 대리사무계약 등","x":"제3조(신탁계약 및 대리사무계약 등)\n① 법 제4조제1항제1호에 따른 신탁계약(이하 \"신탁계약\"이라 한다)에는 다음 각 호의 사항이 포함되어야 한다.\n1. 분양받은 자의 소유권등기 전날까지의 토지와 그 정착물의 소유권 관리에 관한 사항\n2. 신탁받은 소유권의 처분에 관한 사항\n3. 신탁을 정산할 때에 분양받은 자가 납부한 분양대금을 다른 채권 및 수익자의 권리보다 우선하여 정산하여야 한다는 사항\n② 법 제4조제1항제1호에 따른 대리사무계약(이하 \"대리사무계약\"이라 한다)에는 다음 각 호의 사항이 포함되어야 한다. \u003c개정 2013.3.23>\n1. 분양받은 자를 보호하기 위한 분양수입금 관리계좌의 개설에 관한 사항\n2. 분양사업자는 분양수입금 총액을 신탁업자(「자본시장과 금융투자업에 관한 법률」에 따른 신탁업자를 말한다. 이하 같다)에게 양도하여야 한다는 사항\n3. 분양대금은 신탁계약 및 대리사무계약에서 정한 토지매입비, 공사비, 설계비, 감리비 또는 그 밖의 부대사업비 등 해당 분양사업과 관련된 용도로만 사용할 수 있다는 사항\n4. 그 밖에 신탁계약의 목적을 달성하기 위하여 국토교통부령으로 정하는 사항\n③ 신탁업자는 제2항제2호에 따라 양도받은 분양수입금을 별도의 독립된 계정으로 회계처리하여야 하며, 신탁계약 및 대리사무계약에서 정한 목적으로만 사용하여야 한다.\n④ 신탁업자가 분양받은 자로부터의 입출금, 분양계약의 해제, 주소 관리 등 분양업무를 수행하는 경우에는 그 관리 내용을 공정하고 투명하게 전산으로 관리하여야 하고, 분양 개시일부터 6개월마다 분양사업자에게 통지하여야 한다. \u003c개정 2014.12.3>"},{"t":"a","n":"제4조","title":"분양보증기관의 종류 등","x":"제4조(분양보증기관의 종류 등)\n① 법 제4조제4항에 따라 분양보증을 할 수 있는 금융기관 등의 종류는 다음 각 호와 같다. \u003c개정 2013.3.23>\n1. 「보험업법」 제4조제1항제2호라목에 따른 보증보험을 취급하는 보험회사(이하 \"보험회사\"라 한다)\n2. 「은행법」 제2조제2호에 따른 은행\n3. 그 밖에 국토교통부령으로 정하는 기관\n② 제1항에 따른 분양보증기관은 분양보증업무를 수행할 때 다음 각 호의 행위를 할 수 있다. \u003c개정 2013.3.23, 2017.10.17>\n1. 보증심사 및 이행(재산조사를 포함한다)을 위한 조사 및 관계인에 대한 자료 제공 요청\n2. 공사감리자에 대한 시공방법ㆍ공정현황ㆍ사용자재 및 자재품질 등에 관한 자료 제출 요청\n3. 「건축법」 제22조에 따른 사용승인(이하 \"사용승인\"이라 한다) 신청 등 국토교통부령으로 정하는 보증의 이행과 관련된 업무"},{"t":"a","n":"제5조","title":"연대보증을 할 수 있는 건설사업자의 요건 등","x":"제5조(연대보증을 할 수 있는 건설사업자의 요건 등)\n법 제4조제5항에서 \"대통령령으로 정하는 건설사업자\"란 「건설산업기본법」 제9조제1항에 따라 종합공사를 시공하는 업종의 등록을 한 건설사업자로서 다음 각 호의 어느 하나에 해당하는 건설사업자를 말한다. 다만, 분양사업자와 「독점규제 및 공정거래에 관한 법률」 제2조제12호에 따른 계열회사의 관계에 있는 건설사업자는 제외한다. \u003c개정 2020.2.18, 2021.12.28>\n1. 자본금이 연대보증 대상 건설공사 계약금액의 50퍼센트 이상일 것\n2. 연대보증 대상 건설공사에 해당되는 용도의 건축물을 시공한 실적이 있고, 최근 5년간 수주(受注)한 금액이 연대보증 대상 건설공사 계약금액의 2배 이상일 것"},{"t":"a","n":"제6조","title":"토지소유권 확보의 예외 등","x":"제6조(토지소유권 확보의 예외 등)\n① 법 제4조제6항 단서에서 \"대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n1. 분양사업자가 「한국토지주택공사법」에 따른 한국토지주택공사(이하 \"한국토지주택공사\"라 한다) 또는 「지방공기업법」에 따라 건축사업을 하기 위하여 설립된 지방공사인 경우\n2. 건축할 대지가 「도시개발법」 등 관계 법률에 따른 환지(換地) 예정지인 경우\n3. 「도시개발법」, 「택지개발촉진법」 등 관계 법률에 따라 조성된 대지를 공급받은 경우로서 그 대지의 지적(地籍)이 정리되지 아니하여 소유권을 확보할 수 없는 경우. 이 경우 대지의 사용권리를 증명하는 서류를 제출하여야 한다.\n② 법 제4조제7항 단서에서 \"대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. \u003c개정 2018.2.9, 2019.10.8>\n1. 분양사업자가 국가, 지방자치단체, 한국토지주택공사 또는 「지방공기업법」에 따라 건축사업을 하기 위하여 설립된 지방공사인 경우\n2. 분양사업자가 「도시 및 주거환경정비법」 또는 「빈집 및 소규모주택 정비에 관한 특례법」에 따른 정비사업조합인 경우\n3. 법 제4조제1항제1호에 따라 분양보증을 받은 경우로서 분양보증기관이 저당권 또는 가등기담보권 등 담보물권(擔保物權)을 설정한 경우\n4. 법 제4조제7항 본문에 따른 저당권 또는 가등기담보권 설정액에 상당하는 금액을 보험회사의 책임으로 변제(辨濟)한다는 보증보험에 가입한 경우\n5. 다음 각 목의 어느 하나에 해당하는 구분지상권이 설정된 경우로서 구분지상권자의 동의를 받은 경우\n가. 「도로법」 제28조제3항에 따른 구분지상권\n나. 「도시철도법」 제12조에 따른 구분지상권\n다. 「철도의 건설 및 철도시설 유지관리에 관한 법률」 제12조의3에 따른 구분지상권"},{"t":"a","n":"제7조","title":"분양신고","x":"제7조(분양신고)\n① 분양사업자가 법 제5조제2항에 따라 분양신고를 할 때에 분양신고서에 첨부해야 하는 서류는 다음 각 호와 같다. 이 경우 「건축법」 제11조에 따른 허가권자(이하 \"허가권자\"라 한다)는 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 해당 건축물을 건축할 대지의 토지등기사항증명서를 확인해야 한다. \u003c개정 2019.10.8, 2020.2.18>\n1. 신탁계약서 및 대리사무계약서 또는 분양보증서의 사본(법 제4조제1항제1호에 따라 착공신고 후에 분양을 하는 경우로 한정한다)\n2. 연대보증서 및 「건축법」 제25조에 따라 지정된 공사감리자(이하 \"공사감리자\"라 한다)의 공정확인서(법 제4조제1항제2호에 따라 골조공사의 3분의 2 이상을 완료한 후에 분양을 하는 경우로 한정한다)\n3. 분양 광고안\n4. 「부동산개발업의 관리 및 육성에 관한 법률」 제7조에 따른 부동산개발업등록증 또는 같은 법 시행령 제7조제2항에 따라 등록사업자와 체결한 협약서(같은 법 제4조에 따라 부동산개발업 등록을 해야 하는 분양사업자만 해당한다)\n② 허가권자는 제1항 각 호 외의 부분 후단에 따라 확인한 토지등기사항증명서에 제6조제2항제5호 각 목에 따른 구분지상권이 설정되어 있는 경우 그 구분지상권자의 동의 여부를 확인해야 한다. \u003c신설 2019.10.8, 2020.2.18>\n③ 허가권자는 분양사업자로부터 분양신고서가 제출된 경우에는 신고 접수일부터 5일 이내에 수리(受理) 여부를 결정하여야 하고, 분양신고를 수리할 때에는 분양사업자에게 국토교통부령으로 정하는 분양신고확인증을 발급하여야 한다. \u003c개정 2013.3.23, 2019.10.8>"},{"t":"a","n":"제7조의2","title":"공개모집의 방법 등","x":"제7조의2(공개모집의 방법 등)\n① 법 제6조제1항 후단에서 \"대통령령으로 정하는 용도 및 규모의 건축물\"이란 오피스텔 또는 생활숙박시설로서 300실 이상인 건축물을 말한다. \u003c개정 2023.12.19>\n② 분양사업자는 법 제6조제1항 후단에 따라 인터넷을 활용하여 분양받을 자를 공개모집하는 경우 다음 각 호의 어느 하나에 해당하는 기관 중 국토교통부장관이 지정ㆍ고시하는 기관에 청약접수 및 분양받을 자의 선정에 관한 업무를 대행하도록 해야 한다. \u003c개정 2019.10.8>\n1. 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관\n2. 「건설산업기본법」, 「부동산개발업의 관리 및 육성에 관한 법률」, 「주택법」 및 그 밖의 법률에 따라 설립된 협회\n3. 「민법」 제32조에 따라 금융위원회의 허가를 받아 설립된 금융결제원\n③ 제2항에 따라 청약접수 및 분양받을 자의 선정에 관한 업무를 수행하는 기관은 청약경쟁률을 인터넷 홈페이지 등에 게시하여야 한다.\n④ 법 제6조제1항에 따른 공개모집은 1일 8시간 이상으로 해야 하며, 같은 조 제3항에 따른 공개추첨은 공개모집이 끝난 이후에 해야 한다. \u003c신설 2019.10.8>"},{"t":"a","n":"제8조","title":"분양 광고 등","x":"제8조(분양 광고 등)\n① 법 제6조제2항에 따라 분양 광고에 포함해야 하는 사항은 다음 각 호와 같다. 다만, 두 번째 이후의 분양 광고로서 광고 문구에 제2호부터 제5호까지, 제5호의2, 제6호, 제10호의2 및 제16호의 사항은 분양사업장(분양 건축물의 견본 등을 설치하고 청약 안내 등을 하는 장소를 말한다. 이하 같다)에서 게시한다는 것을 밝히고 이를 포함하지 않을 수 있다. \u003c개정 2013.3.23, 2017.10.17, 2018.1.23, 2019.10.8, 2020.2.18, 2021.11.2>\n1. 분양신고번호 및 분양신고일\n2. 대지의 지번(地番)\n3. 건축물 연면적\n4. 분양가격(면적별ㆍ용도별 또는 위치별로 구분할 수 있다)\n5. 건축물의 층별 용도\n5의2. 건축물의 내진(耐震)설계에 관한 다음 각 목의 사항\n가. 「건축법」 제48조제3항에 따른 내진성능 확보 여부\n나. 「건축법」 제48조의3제2항에 따라 산정한 내진능력\n5의3. 건축물의 대지에 관한 다음 각 목의 사항\n가. 「국토의 계획 및 이용에 관한 법률」에 따른 용도지역, 용도지구, 용도구역 현황 및 지구단위계획의 수립 여부\n나. 「교육환경 보호에 관한 법률」 제8조에 따른 교육환경보호구역 설정 여부\n5의4. 건축물의 용도가 생활숙박시설인 경우 다음 각 목의 사항\n가. 「공중위생관리법」 제3조제1항 전단에 따른 숙박업 신고 의무가 있다는 내용과 위반 시 제재처분에 관한 사항\n나. 「건축법」 제19조 및 같은 법 시행령 제14조에 따라 단독주택, 공동주택 또는 오피스텔로 용도변경을 한 경우에만 주거용으로 사용할 수 있다는 내용과 위반 시 제재처분에 관한 사항\n6. 분양사업자(신탁계약에 따라 「자본시장과 금융투자업에 관한 법률」에 따른 신탁업자가 분양사업자가 되는 경우에는 분양사업자와 위탁자를 말한다)ㆍ분양대행사 및 시공업체의 명칭\n7. 분양대금의 관리자와 분양사업자 간의 관계\n8. 신탁업자 또는 분양보증기관의 명칭(법 제4조제1항제1호에 해당하는 경우로 한정한다)\n9. 연대보증을 한 둘 이상의 건설사업자의 명칭(법 제4조제1항제2호에 해당하는 경우로 한정한다)\n10. 준공예정일 및 입주예정일\n10의2. 분양받은 자의 사용승인 전 건축물 방문에 관한 사항(건축물이 오피스텔인 경우로 한정한다)\n11. 분양받을 자의 모집기간ㆍ모집방법(인터넷을 활용한 청약접수 가능 여부 및 방법을 포함한다) 및 선정 일시\n12. 구분소유권에 대하여 우선적으로 공개모집을 하는 경우 그 업종, 건축물 내 위치, 전체 분양면적 중 우선 모집 면적비율, 분양받을 자의 자격제한 등 우선 공개모집의 내용에 관한 사항(제4항에 해당하는 경우로 한정한다)\n13. 거주자 우선 분양에 관한 사항(법 제6조의2에 해당하는 경우로 한정한다)\n14. 전매행위 제한에 관한 사항(법 제6조의3에 해당하는 경우로 한정한다)\n15. 구분지상권의 설정에 관한 사항(제6조제2항제5호에 해당하는 경우로 한정한다)\n16. 그 밖에 국토교통부령으로 정하는 사항\n② 분양사업자는 분양 광고를 전국을 주된 보급지역으로 하는 일간신문 또는 해당 사업장이 위치한 지역을 주된 보급지역으로 하는 일간신문에 1회 이상 게재하여야 한다. 다만, 분양분이 100실 미만인 오피스텔의 경우 해당 사업장이 위치한 시ㆍ군ㆍ자치구의 인터넷 홈페이지에 게시하는 방법으로 분양 광고를 할 수 있다. \u003c개정 2017.10.17>\n③ 분양 광고는 최초 청약 신청 접수일 5일 이전에 하여야 한다. \u003c신설 2017.10.17>\n④ 다음 각 호의 어느 하나에 해당하는 구분소유권에 대해서는 청약 자격을 제한하여 우선적으로 공개모집할 수 있다. \u003c개정 2017.10.17>\n1. 바닥면적의 합계가 1천제곱미터 이상인 구분소유권\n2. 연면적의 5분의 1 이상인 구분소유권\n⑤ 분양사업장을 설치할 때에는 국토교통부장관이 정하는 기준에 따라 설치하여야 하며, 분양 광고의 내용과 다르게 견본을 설치하거나 분양 안내를 할 수 없다. \u003c개정 2013.3.23, 2017.10.17>"},{"t":"a","n":"제9조","title":"분양계약서","x":"제9조(분양계약서)\n① 법 제6조제4항에서 \"대통령령으로 정하는 사항\"이란 다음 각 호의 사항을 말한다. \u003c개정 2014.12.3, 2017.10.17, 2018.1.23, 2019.10.8, 2020.2.18, 2021.11.2>\n1. 분양사업자ㆍ분양대행사 및 시공업체의 명칭\n2. 분양신고번호 및 신고확인증 발급일\n3. 분양 건축물의 표시(전용면적ㆍ공용면적ㆍ계약면적 및 대지지분을 포함한다). 이 경우 오피스텔의 전용면적은 건축물의 외벽의 내부선을 기준으로 산정한 면적으로 하고, 2세대 이상이 공동으로 사용하는 부분으로서 다음 각 목의 어느 하나에 해당하는 공용면적을 제외하며, 바닥면적에서 전용면적을 제외하고 남는 외벽면적은 공용면적에 가산한다.\n가. 복도ㆍ계단ㆍ현관 등 오피스텔의 지상층에 있는 공용면적\n나. 가목의 공용면적을 제외한 지하층ㆍ관리사무소 등 그 밖의 공용면적\n3의2. 공용부분의 위치ㆍ규모가 표시된 국토교통부령으로 정하는 건축 평면도(분양받은 부분이 위치한 층만 해당한다)\n4. 분양대금 계좌번호 및 예금주, 분양대금의 관리자\n5. 신탁계약 및 대리사무계약 또는 분양보증계약의 종류와 신탁업자 또는 분양보증기관의 명칭(법 제4조제1항제1호에 따라 착공신고 후 분양을 하는 경우로 한정한다)\n6. 연대보증을 한 둘 이상의 건설사업자의 명칭(법 제4조제1항제2호에 따라 골조공사를 3분의 2 이상 완료한 후에 분양을 하는 경우로 한정한다)\n7. 분양가격, 계약금ㆍ중도금ㆍ잔금 등의 납부시기 및 납부방법(계약금, 회차별 중도금, 잔금으로 구분하여 납부일 및 납부 금융기관 등을 분명하게 밝혀야 한다)\n8. 분양계약 후 건축물의 내부구조 변경에 관한 사항\n9. 준공예정일 또는 입주예정일\n9의2. 「집합건물의 소유 및 관리에 관한 법률」 제9조의3제2항에 따른 공정증서의 설명 및 확인에 관한 사항\n9의3. 생활숙박시설의 경우 분양받은 자가 국토교통부령으로 정하는 서식에 따라 제8조제1항제5호의4의 사항을 확인했다는 내용\n10. 분양계약증명서의 고유번호\n10의2. 법 제6조의3에 따른 전매행위 제한에 관한 사항\n11. 분양사업자가 분양대상 건축물과 관련하여 다음 각 목의 어느 하나에 해당하는 경우에는 분양받은 자가 분양계약을 해약(解約)할 수 있다는 사항\n가. 법 제9조에 따른 시정명령을 받은 경우\n나. 법 제10조에 따라 벌금형 이상의 형을 선고받은 경우\n다. 법 제12조에 따른 과태료 부과처분을 받은 경우\n12. 구분지상권의 설정에 관한 사항(제6조제2항제5호에 해당하는 경우로 한정한다)\n13. 그 밖에 허가권자가 필요하다고 인정하는 사항\n② 법 제6조제5항 전단에 따라 분양사업자는 분양받을 자를 선정하고 남은 부분이 있거나 분양계약을 체결하고 남은 부분이 있는 경우에는 수의계약(隨意契約)으로 분양할 수 있다. \u003c개정 2013.3.23, 2014.12.3, 2026.3.31>\n1. 삭제\u003c2014.12.3>\n2. 삭제\u003c2014.12.3>\n3. 삭제\u003c2014.12.3>\n③ 삭제 \u003c2014.12.3>"},{"t":"a","n":"제9조의2","title":"거주자 우선 분양 기준","x":"제9조의2(거주자 우선 분양 기준)\n① 삭제 \u003c2018.1.23>\n② 「주택법」 제63조제1항에 따라 지정된 투기과열지구 또는 같은 법 제63조의2제1항제1호에 따라 지정된 조정대상지역에서 분양하는 건축물 중 다음 각 호의 구분에 따른 분양분은 분양 신고일 현재 그 건축물이 건설되는 지역의 거주자로서 분양을 신청한 자 중에서 1명당 1실을 기준으로 우선 분양해야 한다. \u003c개정 2017.10.17, 2018.1.23, 2021.11.2>\n1. 오피스텔\n가. 분양분이 100실 이상인 경우: 분양분의 100분의 10 이상 100분의 20 이하의 범위에서 허가권자가 정하는 비율에 해당하는 분양분\n나. 분양분이 100실 미만인 경우: 분양분의 100분의 10 이하의 범위에서 허가권자가 정하는 비율에 해당하는 분양분\n2. 오피스텔 외의 건축물: 분양분(제8조제4항에 따른 우선 모집분은 제외한다)의 100분의 10 이하의 범위에서 허가권자가 정하는 비율에 해당하는 분양분\n③ 제2항에 따른 우선 분양을 신청한 자 중에서 분양받을 자로 선정되지 못한 자는 별도의 신청 절차 없이 법 제6조제3항에 따라 분양신청을 한 자에 포함한다."},{"t":"a","n":"제9조의3","title":"전매행위의 제한기간 등","x":"제9조의3(전매행위의 제한기간 등)\n① 법 제6조의3제1항 전단에서 \"대통령령으로 정하는 용도 및 규모의 건축물\"이란 오피스텔로서 100실 이상인 건축물을 말한다. \u003c개정 2018.1.23>\n② 법 제6조의3제1항 전단에서 \"대통령령으로 정하는 기간\"이란 사용승인일부터 소유권이전등기일까지의 기간을 말한다. 다만, 사용승인일부터 1년이 지난 날까지 소유권이전등기를 마치지 아니한 경우에는 사용승인일부터 1년간을 말한다."},{"t":"a","n":"제10조","title":"설계의 변경","x":"제10조(설계의 변경)\n법 제7조제1항 전단에서 \"대통령령으로 정하는 설계변경\"이란 다음 각 호의 어느 하나에 해당하는 변경을 말한다. \u003c개정 2020.2.18, 2026.3.31>\n1. 건축물 공급가격의 인상을 초래하는 변경\n2. 공용면적ㆍ전용면적ㆍ대지지분 또는 층고가 감소하는 변경. 다만, 「공간정보의 구축 및 관리 등에 관한 법률」 제2조제4호의2에 따른 지적확정측량에 따라 대지지분이 2퍼센트 이내로 감소하는 경우로서 대지지분의 감소가 부득이하다고 허가권자가 인정하는 경우는 제외한다.\n3. 내장재료 및 외장재료의 변경(공사감리자가 건축허가를 받을 당시의 재료와 동등하거나 그 이상이라고 판단한 변경은 제외한다)\n4. 용도변경(구분소유되는 분양구획의 용도가 「건축법 시행령」 별표 1의 같은 호에 속하는 용도로의 변경은 제외한다)\n5. 난방기기ㆍ냉방기기 등 주요 설비를 변경하여 건축물 사용가격의 인상을 초래하는 변경\n6. 층수가 증감(增減)되는 경우\n7. 연면적이 10퍼센트 이상 증감되는 경우"},{"t":"a","n":"제11조","title":"분양대금","x":"제11조(분양대금)\n① 분양사업자가 법 제8조제2항에 따라 분양받은 자로부터 받는 계약금은 분양대금의 20퍼센트 이내로 하고, 중도금은 분양대금의 70퍼센트 이내로 한다. 다만, 법 제4조제1항제2호에 해당하는 경우에는 분양사업자가 계약금ㆍ중도금 및 잔금의 비율을 따로 정할 수 있다.\n② 제1항 본문에 따른 분양대금은 다음 각 호의 구분에 따라 그 해당 시기에 받을 수 있다.\n1. 계약금: 계약 체결 시\n2. 중도금: 공사감리자의 공정확인서에 의한 건축공사비(대지 매입비는 제외한다)의 50퍼센트 이상의 투입이 확인된 때를 기준으로 그 전후 각 2회 이상으로 구분하여 받을 수 있으며, 최초로 납부하는 중도금은 계약일부터 1개월이 지난 날부터 받을 수 있다.\n3. 잔금: 사용승인일 이후. 다만, 「건축법」 제22조제3항 단서에 따라 임시 사용승인을 받아 입주하는 경우에는 잔금 중 50퍼센트는 입주일에, 나머지 50퍼센트는 사용승인일 이후에 받을 수 있다."},{"t":"a","n":"제11조의2","title":"분양 관련 정보의 종합관리","x":"제11조의2(분양 관련 정보의 종합관리)\n① 국토교통부장관 또는 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사ㆍ특별자치도지사(이하 \"국토교통부장관등\"이라 한다)는 법 제8조의2제2항에 따라 허가권자, 건축물의 분양과 관련된 분양사업자 및 관련 기관ㆍ단체 등에 다음 각 호의 자료를 제출하도록 요청할 수 있다.\n1. 법 제5조제1항 및 제2항에 따른 분양신고의 내용 및 신고 자료\n2. 법 제5조제3항에 따른 분양신고 수리 통보 내용\n3. 법 제5조제3항에 따라 분양신고를 수리한 건축물의 사용승인(「건축법」 제22조에 따른 사용승인을 말한다) 내용\n4. 법 제6조제4항 및 제5항에 따른 분양계약 체결 현황\n5. 그 밖에 건축물의 분양과 관련된 정보를 종합적으로 관리하기 위해 필요한 자료로서 국토교통부령으로 정하는 자료\n② 국토교통부장관등은 제1항에 따라 자료 제출을 요청하는 경우 법 제8조의2제3항에 따른 건축물 분양 정보관리체계(이하 \"건축물분양정보관리체계\"라 한다)를 통하여 해당 자료를 제출하도록 할 수 있다.\n③ 국토교통부장관은 건축물분양정보관리체계의 효율적인 구축ㆍ운영 및 활용 촉진을 위하여 다음 각 호의 업무를 수행할 수 있다.\n1. 건축물분양정보관리체계의 구축ㆍ운영에 관한 연구개발 및 기술지원\n2. 건축물분양정보관리체계의 구축ㆍ운영을 위한 공동사업의 시행\n3. 건축물분양정보관리체계를 이용한 정보의 공동 활용 촉진\n④ 국토교통부장관은 법 제8조의2제4항에 따라 건축물분양정보관리체계의 구축ㆍ운영 업무를 「한국부동산원법」에 따른 한국부동산원 또는 국토교통부령으로 정하는 인력ㆍ시설 등을 갖춘 공공기관ㆍ정부출연연구기관에 위탁할 수 있다.\n⑤ 국토교통부장관은 제4항에 따라 업무를 위탁한 때에는 위탁받은 기관 및 위탁업무의 내용 등을 관보에 고시해야 한다."},{"t":"a","n":"제12조","title":"공표 방법 및 절차 등","x":"제12조(공표 방법 및 절차 등)\n① 허가권자는 법 제9조제1항에 따라 분양사업자에게 위반행위의 시정을 명할 때에는 위반행위의 내용 및 정도, 기간 및 횟수, 매체 및 광고의 크기 등을 고려하여야 한다.\n② 허가권자가 제1항에 따라 위반행위의 시정을 명할 때에는 해당 분양사업자에게 미리 공표 문안 등에 관하여 허가권자와 협의하게 할 수 있다.\n③ 시정명령을 받은 분양사업자는 시정명령을 받은 날부터 10일 이내에 시정명령을 받은 내용과 정정사항 등을 위반행위가 이루어진 해당 간행물ㆍ분양사업장 또는 전자매체에 공표하여야 한다.\n④ 제3항에 따른 공표는 평일(토요일과 「관공서의 공휴일에 관한 규정」 제2조에 따른 공휴일을 제외한 날을 말한다)에 게재하도록 하고, 공표 제목에는 시정명령을 받은 사실을 명료하게 표시하여야 하며, 위반행위가 이루어진 분양 광고 크기의 4분의 1 이상으로 공표하여야 한다.\n⑤ 허가권자는 시정명령을 받은 분양사업자가 제3항에 따라 공표한 날부터 10일 이내에 그 명령을 이행하였는지를 확인하여야 한다."},{"t":"a","n":"제12조의2","title":"고유식별정보의 처리","x":"제12조의2(고유식별정보의 처리)\n국토교통부장관등(법 제8조의2제4항에 따라 국토교통부장관의 업무를 위탁받은 자를 포함한다)은 건축물의 분양과 관련된 정보의 관리ㆍ제공 및 건축물분양정보관리체계의 구축ㆍ운영에 관한 사무를 수행하기 위하여 불가피한 경우 「개인정보 보호법 시행령」 제19조제1호, 제2호 또는 제4호에 따른 주민등록번호, 여권번호 또는 외국인등록번호가 포함된 자료를 처리할 수 있다."},{"t":"a","n":"제12조의3","title":"규제의 재검토","x":"제12조의3(규제의 재검토)\n국토교통부장관은 다음 각 호의 사항에 대하여 다음 각 호의 기준일을 기준으로 3년마다(매 3년이 되는 해의 기준일과 같은 날 전까지를 말한다) 그 타당성을 검토하여 개선 등의 조치를 하여야 한다. \u003c개정 2017.10.17, 2020.2.18>\n1. 제2조에 따른 적용 범위: 2014년 1월 1일\n2. 제5조에 따른 연대보증을 할 수 있는 건설사업자의 요건 등: 2014년 1월 1일\n3. 삭제\u003c2020.3.3>\n4. 삭제\u003c2020.3.3>\n5. 삭제\u003c2020.3.3>\n6. 삭제\u003c2020.3.3>\n7. 삭제\u003c2016.12.30>\n8. 제9조의2에 따른 거주자 우선 분양 기준: 2014년 1월 1일\n9. 제9조의3에 따른 전매행위의 제한기간 등: 2014년 1월 1일\n10. 제11조에 따른 분양대금 납입방법: 2014년 1월 1일\n11. 삭제\u003c2020.3.3>"},{"t":"a","n":"제13조","title":"과태료의 부과기   if (EMB) { D.index = EMB.index; D.changes = EMB.changes || []; for (const [k, v] of Object.entries(EMB.laws)) D.laws.set(k, v); return; }
  const r = await fetch('data/index.json', { cache: 'no-cache' });
  D.index = await r.json();
  try { D.changes = await (await fetch('data/changes.json', { cache: 'no-cache' })).json(); } catch { D.changes = []; }
}
async function loadLaw(id) {
  if (D.laws.has(id)) return D.laws.get(id);
  const meta = lawMeta(id);
  const v = meta ? `?m=${meta.mst}` : '';
  const r = await fetch(`data/laws/${id}.json${v}`);
  if (!r.ok) throw new Error('법령 파일을 불러오지 못했어요');
  const d = await r.json();
  D.laws.set(id, d);
  return d;
}
async function loadAll(onp) {
  const ids = D.index.laws.map((l) => l.id).filter((id) => !D.laws.has(id));
  let done = D.index.laws.length - ids.length;
  const total = D.index.laws.length;
  onp && onp(done / total);
  const q = [...ids];
  await Promise.all(Array.from({ length: 4 }, async () => {
    while (q.length) { const id = q.shift(); try { await loadLaw(id); } catch {} done++; onp && onp(done / total); }
  }));
}
const lawMeta = (id) => D.index.laws.find((l) => l.id === id);
function resolveLawName(text) {
  // 텍스트 앞부분에서 법령명(정식명·약칭, '시행령/시행규칙' 포함)을 찾아 {law, rest} 반환
  const t = text.trim();
  const tn = nz(t);
  const cands = [];
  for (const l of D.index.laws) cands.push([nz(l.name), l]);
  for (const [a, full] of Object.entries(ALIAS)) {
    for (const l of D.index.laws) {
      if (nz(l.name) === nz(full)) cands.push([nz(a), l]);
      else if (nz(l.name).startsWith(nz(full))) cands.push([nz(a) + nz(l.name).slice(nz(full).length), l]);
    }
  }
  cands.sort((a, b) => b[0].length - a[0].length);
  for (const [key, l] of cands) {
    if (tn.startsWith(key)) {
      // 원문 기준으로 key 길이만큼 소비
      let i = 0, k = 0;
      while (i < t.length && k < key.length) { if (!/\s/.test(t[i])) k++; i++; }
      return { law: l, rest: t.slice(i).trim() };
    }
  }
  return null;
}

function bodyHTML(text, terms) {
  const lines = String(text).split('\n');
  return lines.map((ln, i) => {
    let s = ln.trim();
    if (i === 0) s = s.replace(/^제\d+조(?:의\d+)?\s*\([^)]*\)\s*/, ''); // 머리 반복 제거
    if (!s) return '';
    let cls = '';
    if (/^[①-⑳㉑-㉟]/.test(s)) cls = 'l1';
    else if (/^\d+(의\d+)?\.\s/.test(s)) cls = 'l2';
    else if (/^[가-하]\.\s/.test(s)) cls = 'l3';
    else if (/^\d+\)\s/.test(s)) cls = 'l4';
    let h = esc(s);
    h = h.replace(/(&lt;(?:개정|신설|삭제|전문개정|본조신설|제목개정|종전)[^&]*?&gt;|\[(?:본조신설|전문개정|제목개정|종전|시행일)[^\]]*\])/g, '<span class="amend">$1</span>');
    if (terms && terms.length) h = mark(h, terms);
    return `<p class="${cls}">${h}</p>`;
  }).join('');
}
function mark(html, terms) {
  const t = terms.filter(Boolean).map((x) => esc(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!t.length) return html;
  const re = new RegExp(`(${t.join('|')})`, 'gi');
  return html.split(/(<[^>]+>)/).map((part) => part.startsWith('<') ? part : part.replace(re, '<mark>$1</mark>')).join('');
}

let searchSeq = 0;
async function doSearch(q, enter) {
  const seq = ++searchSeq;
  const body = $('#body');
  // 1) "법령명 + 조번호" → 바로 이동
  const r = resolveLawName(q);
  if (r) {
    const m = r.rest.replace(/\s/g, '').match(/^제?(\d+)조?(?:의(\d+))?$/);
    if (m) {
      const n = `제${m[1]}조${m[2] ? '의' + m[2] : ''}`;
      if (enter) { location.hash = `#/law/${r.law.id}/${encodeURIComponent(n)}`; return; }
      body.innerHTML = `<div class="res" id="jumpres"><div class="h"><span class="an">${esc(n)}</span><span class="ln">${esc(r.law.name)}</span></div><div class="sn">엔터 또는 눌러서 바로 보기</div></div>`;
      $('#jumpres').onclick = () => location.hash = `#/law/${r.law.id}/${encodeURIComponent(n)}`;
      return;
    }
    if (!r.rest) {
      body.innerHTML = `<div class="res" id="jumpres"><div class="h"><span class="an">${esc(r.law.name)}</span></div><div class="sn">법령 전체 보기</div></div>`;
      $('#jumpres').onclick = () => location.hash = `#/law/${r.law.id}`;
      if (enter) location.hash = `#/law/${r.law.id}`;
      return;
    }
  }
  // 2) 전문 검색
  const scope = r ? [r.law] : D.index.laws;
  const terms = (r ? r.rest : q).split(/\s+/).filter(Boolean);
  const need = scope.filter((l) => !D.laws.has(l.id));
  if (need.length) {
    body.innerHTML = `<div class="note">법령 본문을 불러오는 중… (처음 한 번만)</div><div class="progress"><i id="pg"></i></div>`;
    if (r) { try { await loadLaw(r.law.id); } catch {} }
    else await loadAll((p) => { const pg = $('#pg'); if (pg) pg.style.width = (p * 100).toFixed(0) + '%'; });
    if (seq !== searchSeq) return;
  }
  const res = [];
  const lt = terms.map((t) => t.toLowerCase());
  for (const meta of scope) {
    const law = D.laws.get(meta.id); if (!law) continue;
    for (const a of law.items) {
      if (a.t !== 'a') continue;
      const hay = (a.title + '\n' + a.x).toLowerCase();
      if (!lt.every((t) => hay.includes(t) || nz(a.n) === nz(t))) continue;
      let score = 0;
      for (const t of lt) { if (a.title.toLowerCase().includes(t)) score += 5; score += Math.min(3, hay.split(t).length - 1); }
      res.push({ law, a, score });
    }
  }
  res.sort((x, y) => y.score - x.score);
  if (seq !== searchSeq) return;
  const top = res.slice(0, 200);
  const online = navigator.onLine && !OFFLINE_FILE;
  let h = `<div class="section-t">${r ? esc(r.law.name) + ' 안에서 ' : ''}'${esc(terms.join(' '))}' 검색 결과 ${res.length.toLocaleString()}건${res.length > 200 ? ' (상위 200건)' : ''}</div>`;
  if (!top.length) h += `<div class="empty"><div class="big">🔍</div>담아둔 법령에서는 찾지 못했어요.${online ? `<br><br><a href="https://www.law.go.kr/lsSc.do?menuId=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">법제처에서 '${esc(q)}' 찾아보기 ↗</a>` : ''}</div>`;
  h += top.map(({ law, a }) => {
    const plain = a.x.replace(/^제\d+조(?:의\d+)?\s*\([^)]*\)\s*/, '');
    const low = plain.toLowerCase();
    const at = Math.max(0, low.indexOf(lt[0]) - 40);
    const snip = (at > 0 ? '…' : '') + plain.slice(at, at + 180).replace(/\n/g, ' ');
    return `<div class="res" data-href="#/law/${law.id}/${encodeURIComponent(a.n)}" data-q="${esc(terms.join(' '))}">
      <div class="h"><span class="an">${esc(a.n)}</span><span>${mark(esc(a.title), terms)}</span><span class="ln">${esc(law.name)}</span></div>
      <div class="sn">${mark(esc(snip), terms)}</div></div>`;
  }).join('');
  if (top.length && online) h += `<div class="foot"><a href="https://www.law.go.kr/lsSc.do?menuId=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">담아두지 않은 법령까지 법제처에서 찾기 ↗</a></div>`;
  body.innerHTML = h;
  body.querySelectorAll('.res').forEach((el) => el.onclick = () => { sessionStorage.setItem('bd.hl', el.dataset.q); location.hash = el.dataset.href; });
}

    app.innerHTML = `<div class="empty"><div class="big">📡</div>${esc(e.message)}<br>인터넷이 없을 때는 미리 한 번 열어본 법령만 보여요.<br><a href="#/">처음으로</a></div>`; return;
  }
  const hl = (sessionStorage.getItem('bd.hl') || '').split(/\s+/).filter(Boolean);
  sessionStorage.removeItem('bd.hl');
  const online = navigator.onLine && !OFFLINE_FILE;
  let toc = '', arts = '';

          </span></div>
        <div class="body">${bodyHTML(it.x, hl)}</div>

    }
  }
  const fs = store.get('fs', 16);
  document.documentElement.style.setProperty('--fs', fs + 'px');
  app.innerHTML = `
    <div class="lawview">
      <nav class="toc" id="toc">${toc}</nav>
      <div>
        <div class="lawhead" style="padding-top:2px">

          <h1>${esc(law.name)}</h1>
          <div class="mt"><span class="kind ${esc(law.kind)}">${esc(law.kind || '법령')}</span>
            <span>시행 ${fmtD(law.effective)}</span><span>공포 ${fmtD(law.promulgated)}</span>
            ${law.dept ? `<span>${esc(law.dept)}</span>` : ''}<span>${law.items.filter((i) => i.t === 'a').length}개 조문</span>
            ${online ? `<a href="${lawGoKr(law.name)}" target="_blank" rel="noopener">법제처 원문 ↗</a>` : ''}</div>
        </div>
        <div class="tools">
          <button class="iconbtn tocbtn" id="tocBtn">목차</button>
          <input class="jump" id="jump" inputmode="numeric" placeholder="조 번호" aria-label="조 번호로 이동">
          <input class="find" id="find" type="search" placeholder="이 법령 안에서 찾기" value="${esc(hl.join(' '))}" aria-label="이 법령 안에서 찾기">
          <span class="cnt" id="cnt"></span>
          <button class="iconbtn" id="fsDown" title="글자 작게">가−</button>
          <button class="iconbtn" id="fsUp" title="글자 크게">가+</button>
        </div>
        <div id="arts">${arts}</div>
      </div>
    </div>`;
  const tocEl = $('#toc');
  $('#back').onclick = () => history.length > 1 ? history.back() : (location.hash = '#/');
  $('#tocBtn').onclick = () => tocEl.classList.toggle('open');
  tocEl.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-go]'); if (!a) return;
    e.preventDefault(); tocEl.classList.remove('open'); scrollToEl(document.getElementById(a.dataset.go));
  });
  $('#jump').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const m = e.target.value.replace(/\s/g, '').match(/^제?(\d+)조?(?:의(\d+))?$/);
    if (!m) return toast('예: 22 또는 22의2');
    const n = `제${m[1]}조${m[2] ? '의' + m[2] : ''}`;
    const el = document.getElementById('a-' + n);
    if (el) { scrollToEl(el, true); history.replaceState(null, '', `#/law/${id}/${encodeURIComponent(n)}`); } else toast(`${n}는 없어요`);
  });
  const setFs = (v) => { v = Math.max(13, Math.min(22, v)); store.set('fs', v); document.documentElement.style.setProperty('--fs', v + 'px'); };
  $('#fsDown').onclick = () => setFs(store.get('fs', 16) - 1);
  $('#fsUp').onclick = () => setFs(store.get('fs', 16) + 1);
  // 법령 안 찾기
  let ft;
  const findInp = $('#find');
  const runFind = () => {
    const terms = findInp.value.trim().split(/\s+/).filter(Boolean);
    let n = 0, first = null;
    for (const el of app.querySelectorAll('.art')) {
      const it = law.items.find((x) => x.t === 'a' && x.n === el.dataset.n);
      el.querySelector('.body').innerHTML = bodyHTML(it.x, terms);
      const c = el.querySelectorAll('mark').length; n += c;
      if (c && !first) first = el;
    }
    $('#cnt').textContent = terms.length ? `${n}곳` : '';
    return first;
  };
  findInp.addEventListener('input', () => { clearTimeout(ft); ft = setTimeout(runFind, 250); });
  findInp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const marks = [...app.querySelectorAll('#arts mark')];
    if (!marks.length) return;
    const y = 130;
    const next = marks.find((m) => m.getBoundingClientRect().top > y + 4) || marks[0];
    window.scrollTo({ top: scrollY + next.getBoundingClientRect().top - y - 20, behavior: 'smooth' });
  });
  if (hl.length) $('#cnt').textContent = `${app.querySelectorAll('#arts mark').length}곳`;
  // 조문 버튼
  $('#arts').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const art = b.closest('.art'); const it = law.items.find((x) => x.t === 'a' && x.n === art.dataset.n);
    if (b.dataset.act === 'fav') { const on = toggleFav(law, it); b.classList.toggle('on', on); b.innerHTML = on ? ICON.starOn : ICON.star; toast(on ? '즐겨찾기에 담았어요' : '즐겨찾기에서 뺐어요'); }
    if (b.dataset.act === 'copy') copyText(`「${law.name}」 ${it.n}${it.title ? '(' + it.title + ')' : ''}\n` + it.x.split('\n').map((l, i) => i === 0 ? l.replace(/^제\d+조(?:의\d+)?\s*\([^)]*\)\s*/, '') : l).filter(Boolean).join('\n'));
    if (b.dataset.act === 'link') window.open(lawGoKr(law.name, it.n), '_blank', 'noopener');
  });
  // 최근 본 법령
  store.set('recent', [id, ...store.get('recent', []).filter((x) => x !== id)].slice(0, 10));
  if (target) {
    const el = document.getElementById('a-' + target);
    if (el) requestAnimationFrame(() => scrollToEl(el, true));
    else toast(`${target}는 이 법령에 없어요`);
  } else window.scrollTo(0, 0);
}
function scrollToEl(el, flash) {
  if (!el) return;
  const y = el.getBoundingClientRect().top + scrollY - 118;
  window.scrollTo({ top: y, behavior: 'auto' });
  if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

/* ───── 라우터 ───── */
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  const p = h.split('/').filter(Boolean);
  if (p[0] === 'law' && p[1]) return renderLaw(p[1], p.slice(2).join('/') || null);
  if (p[0] === 'search') return renderHome(p.slice(1).join('/'));
  window.scrollTo(0, 0);
  return renderHome('');
}
addEventListener('hashchange', route);

(async () => {
  try { await loadIndex(); }
  catch (e) {
    app.innerHTML = `<div class="empty"><div class="big">📡</div>법령 목록을 불러오지 못했어요.<br>인터넷 연결을 확인하거나, 오프라인 파일(법대로_오프라인.html)을 열어 주세요.</div>`;
    return;
  }
  setStatus();
  route();
  if (!OFFLINE_FILE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
</body>
</html>
