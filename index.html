<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부동산신탁 관계법령</title>
<meta name="description" content="신탁·정비사업·건축·민사 법령을 온·오프라인에서 바로 찾아보는 개인 법령집">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#f6f2ea; --card:#fffdf8; --ink:#1d2433; --ink2:#4a5263; --mute:#7c8393;
  --line:#e4ddcf; --line2:#d6cdbb; --seal:#b3261e; --seal-soft:#f6e2de; --navy:#24365c;
  --hl:#ffe9a8; --hl-ink:#3a2c00; --chip:#efe8da; --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 16px rgba(40,30,10,.05);
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang","바탕",serif;
  --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16181d; --card:#1e2128; --ink:#e8e4da; --ink2:#bfbab0; --mute:#8b8f99;
    --line:#2c3039; --line2:#3a3f4a; --seal:#e0574d; --seal-soft:#3a2321; --navy:#9db4e0;
    --hl:#5a4a12; --hl-ink:#fff1c2; --chip:#272b33; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#16181d; --card:#1e2128; --ink:#e8e4da; --ink2:#bfbab0; --mute:#8b8f99;
  --line:#2c3039; --line2:#3a3f4a; --seal:#e0574d; --seal-soft:#3a2321; --navy:#9db4e0;
  --hl:#5a4a12; --hl-ink:#fff1c2; --chip:#272b33; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.seal{width:32px;height:32px;border-radius:7px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:19px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:-3px}
.bar .sp{flex:1}
.status{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#3a9a5b}
.dot.off{background:#c08a1e}
.iconbtn{border:1px solid var(--line2);background:var(--card);border-radius:9px;height:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn:hover{border-color:var(--ink2)}
.iconbtn svg{width:16px;height:16px}

/* search */
.hero{padding:22px 0 8px}
.search{position:relative}
.search input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 48px 0 46px;box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--navy)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .mag{position:absolute;left:15px;top:15px;width:22px;height:22px;color:var(--mute)}
.search .clr{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;background:transparent;color:var(--mute);border-radius:8px;display:none}
.search.has .clr{display:block}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hint{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.hint:hover{background:var(--chip)}

.tabs{display:flex;gap:4px;margin:18px 0 6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 12px;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--seal);font-weight:700}
.tab .n{font-size:11px;background:var(--chip);border-radius:999px;padding:1px 6px;margin-left:4px;color:var(--ink2)}

main{padding-bottom:80px}
.section-t{font-size:13px;color:var(--mute);font-weight:600;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.section-t::after{content:"";flex:1;height:1px;background:var(--line)}

/* law grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.lawcard{display:block;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.lawcard:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.lawcard .nm{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.lawcard .mt{font-size:12px;color:var(--mute);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.kind{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;background:var(--chip);color:var(--ink2);font-weight:600}
.kind.법률{background:var(--seal-soft);color:var(--seal)}
.new{font-size:11px;color:var(--seal);font-weight:700}

/* results */
.res{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:var(--line2)}
.res .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.res .ln{font-size:12px;color:var(--mute)}
.res .an{font-weight:700}
.res .sn{font-family:var(--serif);font-size:14px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:14px}
.empty .big{font-size:30px;margin-bottom:6px}
.note{font-size:13px;color:var(--ink2);background:var(--chip);border-radius:10px;padding:10px 12px;margin:10px 0}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}

/* law view */
.lawview{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding-top:18px}
.toc{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;font-size:13px;padding-right:6px}
.toc a{display:block;padding:3px 6px;border-radius:6px;color:var(--ink2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{background:var(--chip)}
.toc a.h{color:var(--ink);font-weight:700;margin-top:8px}
.lawhead{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
.back{border:0;background:transparent;color:var(--mute);font-size:13px;padding:0;margin-bottom:8px}
.lawhead h1{font-family:var(--serif);font-size:24px;margin:0;letter-spacing:-.02em;line-height:1.3}
.lawhead .mt{font-size:12.5px;color:var(--mute);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.tools{position:sticky;top:58px;z-index:10;background:var(--paper);display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input{height:34px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:9px;padding:0 10px;font:inherit;font-size:13.5px;outline:none}
.tools input:focus{border-color:var(--navy)}
.tools .jump{width:96px}
.tools .find{flex:1;min-width:120px}
.tools .cnt{font-size:12px;color:var(--mute);min-width:40px}
.hd{font-family:var(--serif);font-weight:800;font-size:calc(var(--fs) + 1px);margin:26px 0 6px;color:var(--ink);text-align:center;letter-spacing:.02em}
.art{padding:14px 0;border-bottom:1px dashed var(--line);scroll-margin-top:120px}
.art.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}
.art .ah{display:flex;align-items:baseline;gap:8px}
.art .ah .lb{font-weight:800;font-size:calc(var(--fs) + .5px);white-space:nowrap}
.art .ah .tt{font-weight:600;font-size:var(--fs);flex:1}
.art .acts{display:flex;gap:2px;opacity:.55}
.art:hover .acts,.art .acts .on{opacity:1}
.art .acts button{border:0;background:transparent;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink2)}
.art .acts button:hover{background:var(--chip)}
.art .acts button.on{color:var(--seal)}
.art .acts svg{width:16px;height:16px}
.art .body{font-family:var(--serif);font-size:var(--fs);line-height:1.85;margin-top:4px;color:var(--ink)}
.art .body p{margin:0}
.art .body .l2{padding-left:1.4em}
.art .body .l3{padding-left:2.6em}
.art .body .l4{padding-left:3.8em}
.art .body .amend{color:var(--mute);font-size:.86em}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:30px 0 10px;line-height:1.7}
.chg{border-left:3px solid var(--seal);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px;cursor:pointer}
.chg .d{font-size:12px;color:var(--mute)}

/* 최근 검색 */
.hints-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.hints-row .lbl2{font-size:12px;color:var(--mute);font-weight:600;margin-right:2px}
.rq{display:inline-flex;align-items:center;border:1px solid var(--line2);background:var(--card);border-radius:999px;font-size:12.5px}
.rq .go{border:0;background:transparent;padding:4px 3px 4px 11px}
.rq .x{border:0;background:transparent;padding:4px 9px 4px 4px;color:var(--mute);font-size:11px}
.linkbtn{border:0;background:transparent;font-size:12px;color:var(--mute);text-decoration:underline;padding:4px}
/* 형광펜 */
.hlm{border-radius:2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-y{background:#fff59d} .hl-g{background:#b9f0b4} .hl-p{background:#ffc4dc} .hl-b{background:#bfe0ff}
.hl-u{background:none;text-decoration:underline;text-decoration-color:var(--seal);text-decoration-thickness:2px;text-underline-offset:4px}
:root[data-theme="dark"] .hlm:not(.hl-u){color:#1d2433}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hlm:not(.hl-u){color:#1d2433}}
.hlbar{position:fixed;z-index:60;display:none;gap:6px;align-items:center;background:var(--ink);color:var(--paper);border-radius:14px;padding:7px 9px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.hlbar.on{display:flex}
.hlbar .sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.75);padding:0}
.hlbar .sw.y{background:#fff59d}.hlbar .sw.g{background:#b9f0b4}.hlbar .sw.p{background:#ffc4dc}.hlbar .sw.b{background:#bfe0ff}
.hlbar .sw.u{background:transparent;color:var(--paper);font-weight:800;text-decoration:underline;text-decoration-color:#e0574d;text-decoration-thickness:2px}
.hlbar .t{border:0;background:transparent;color:var(--paper);font-size:13px;padding:5px 8px;border-radius:8px;white-space:nowrap}
.hlbar .t:hover{background:rgba(255,255,255,.12)}
.hlbar .sep{width:1px;height:22px;background:rgba(255,255,255,.25)}
/* 책갈피 */
.art.bm{box-shadow:inset 3px 0 0 var(--seal);padding-left:12px}
.bmk-memo{font-family:var(--sans);font-size:13px;color:var(--seal);background:var(--seal-soft);border-radius:8px;padding:3px 10px;margin:6px 0 2px;display:inline-block}
.toc a.bmk::before{content:"🔖 "}
.mk-item{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.mk-item:hover{border-color:var(--line2)}
.mk-item .main{flex:1;min-width:0}
.mk-item .del{border:0;background:transparent;color:var(--mute);padding:2px 6px;border-radius:6px}
.mk-item .del:hover{background:var(--chip)}
.mk-item .q{font-family:var(--serif);font-size:14.5px;margin-top:3px;line-height:1.6}
.mk-item .ln{font-size:12px;color:var(--mute)}
.backup{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (max-width:760px){
  .hlbar{left:50%!important;top:auto!important;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%)}
}
@media (max-width:760px){
  .lawview{grid-template-columns:minmax(0,1fr)}
  .toc{display:none;position:fixed;inset:58px 0 0 0;max-height:none;background:var(--paper);z-index:30;padding:14px 16px 40px;font-size:14px}
  .toc.open{display:block}
  .status .txt{display:none}
  .brand small{display:none}
  .brand b{font-size:16.5px;letter-spacing:-.04em}
  .bar{gap:8px}
  .lawhead h1{font-size:21px}
  .iconbtn .lbl{display:none}
  .tools{flex-wrap:nowrap;gap:5px}
  .tools .jump{width:64px;padding:0 8px}
  .tools .find{min-width:0}
  .tools .cnt{min-width:0}
  .tools .iconbtn{padding:0 8px}
}
@media (min-width:761px){ .tocbtn{display:none!important} }
@media print{ header.top,.tools,.toc,.acts,.back{display:none!important} .lawview{display:block} }
</style>
</head>
<body>
<!--EMBED-->
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/" aria-label="부동산신탁 관계법령 처음으로">
      <span class="seal">法</span>
      <span><b>부동산신탁 관계법령</b><small>나만의 실무 법령집</small></span>
    </a>
    <span class="sp"></span>
    <span class="status" id="status"><span class="dot"></span><span class="txt"></span></span>
    <button class="iconbtn" id="themeBtn" title="화면 밝기 전환" aria-label="화면 밝기 전환">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <a class="iconbtn" id="dlBtn" href="offline.html" download="부동산신탁_관계법령_오프라인.html" title="회사 PC용 오프라인 파일 받기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg><span class="lbl">오프라인 파일</span>
    </a>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const EMB = window.__LAW_DATA__ || null;
const OFFLINE_FILE = !!EMB;
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = (d) => d && d.length === 8 ? `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6)}` : (d || '');
const store = {
  get(k, d) { try { const v = localStorage.getItem('bd.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('bd.' + k, JSON.stringify(v)); } catch {} },
};

/* ───── 약칭 ───── */
const ALIAS = {
  '자본시장법':'자본시장과 금융투자업에 관한 법률','자통법':'자본시장과 금융투자업에 관한 법률',
  '도정법':'도시 및 주거환경정비법','도시정비법':'도시 및 주거환경정비법',
  '소규모주택정비법':'빈집 및 소규모주택 정비에 관한 특례법','소규모정비법':'빈집 및 소규모주택 정비에 관한 특례법','빈집법':'빈집 및 소규모주택 정비에 관한 특례법',
  '재정비촉진법':'도시재정비 촉진을 위한 특별법','도촉법':'도시재정비 촉진을 위한 특별법',
  '국토계획법':'국토의 계획 및 이용에 관한 법률','국계법':'국토의 계획 및 이용에 관한 법률',
  '토지보상법':'공익사업을 위한 토지 등의 취득 및 보상에 관한 법률',
  '건축물분양법':'건축물의 분양에 관한 법률','건분법':'건축물의 분양에 관한 법률',
  '부동산개발업법':'부동산개발업의 관리 및 육성에 관한 법률',
  '금소법':'금융소비자 보호에 관한 법률','금융소비자보호법':'금융소비자 보호에 관한 법률',
  '주택공급규칙':'주택공급에 관한 규칙','공급규칙':'주택공급에 관한 규칙',
  '부가세법':'부가가치세법',
};
const nz = (s) => String(s || '').replace(/\s+/g, '');

/* ───── 데이터 ───── */
const D = { index: null, laws: new Map(), changes: [] };
async function loadIndex() {
  if (EMB) { D.index = EMB.index; D.changes = EMB.changes || []; for (const [k, v] of Object.entries(EMB.laws)) D.laws.set(k, v); return; }
  const r = await fetch('data/index.json', { cache: 'no-cache' });
  D.index = await r.json();
  try { D.changes = await (await fetch('data/changes.json', { cache: 'no-cache' })).json(); } catch { D.changes = []; }
}
async function loadLaw(id) {
  if (D.laws.has(id)) return D.laws.get(id);
  const meta = lawMeta(id);
  const v = meta ? `?m=${meta.mst}` : '';
  const r = await fetch(`data/laws/${id}.json${v}`);
  if (!r.ok) throw new Error('법령 파일을 불러오지 못했어요');
  const d = await r.json();
  D.laws.set(id, d);
  return d;
}
async function loadAll(onp) {
  const ids = D.index.laws.map((l) => l.id).filter((id) => !D.laws.has(id));
  let done = D.index.laws.length - ids.length;
  const total = D.index.laws.length;
  onp && onp(done / total);
  const q = [...ids];
  await Promise.all(Array.from({ length: 4 }, async () => {
    while (q.length) { const id = q.shift(); try { await loadLaw(id); } catch {} done++; onp && onp(done / total); }
  }));
}
const lawMeta = (id) => D.index.laws.find((l) => l.id === id);
function resolveLawName(text) {
  // 텍스트 앞부분에서 법령명(정식명·약칭, '시행령/시행규칙' 포함)을 찾아 {law, rest} 반환
  const t = text.trim();
  const tn = nz(t);
  const cands = [];
  for (const l of D.index.laws) cands.push([nz(l.name), l]);
  for (const [a, full] of Object.entries(ALIAS)) {
    for (const l of D.index.laws) {
      if (nz(l.name) === nz(full)) cands.push([nz(a), l]);
      else if (nz(l.name).startsWith(nz(full))) cands.push([nz(a) + nz(l.name).slice(nz(full).length), l]);
    }
  }
  cands.sort((a, b) => b[0].length - a[0].length);
  for (const [key, l] of cands) {
    if (tn.startsWith(key)) {
      // 원문 기준으로 key 길이만큼 소비
      let i = 0, k = 0;
      while (i < t.length && k < key.length) { if (!/\s/.test(t[i])) k++; i++; }
      return { law: l, rest: t.slice(i).trim() };
    }
  }
  return null;
}

/* ───── 형광펜: 조문 본문 글자 위치(시작~끝)로 저장 ───── */
function textNodes(el) { const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const a = []; let n; while ((n = w.nextNode())) a.push(n); return a; }
function rangeOffset(el, node, off) { const r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, off); return r.toString().length; }
function wrapRange(el, s, e, cls, hid) {
  let pos = 0;
  for (const t of textNodes(el)) {
    const len = t.data.length;
    const a = Math.max(s, pos), b = Math.min(e, pos + len);
    if (a < b) {
      let node = t;
      if (b - pos < len) node.splitText(b - pos);
      if (a - pos > 0) node = node.splitText(a - pos);
      const sp = document.createElement('span');
      sp.className = 'hlm hl-' + cls; sp.dataset.hid = hid;
      node.parentNode.insertBefore(sp, node); sp.appendChild(node);
    }
    pos += len;
    if (pos >= e) break;
  }
}
function applyHls(el, lawId, n) {
  const txt = el.textContent;
  for (const h of hls().filter((x) => x.law === lawId && x.n === n)) {
    let s0 = h.s, e0 = h.e;
    if (txt.slice(s0, e0) !== h.q) { const i = txt.indexOf(h.q); if (i < 0) continue; s0 = i; e0 = i + h.q.length; }
    wrapRange(el, s0, e0, h.c, h.id);
  }
}

function bodyHTML(text, terms) {
  const lines = String(text).split('\n');
  return lines.map((ln, i) => {
    let s = ln.trim();
    if (i === 0) s = s.replace(/^제\d+조(?:의\d+)?\s*\([^)]*\)\s*/, ''); // 머리 반복 제거
    if (!s) return '';
    let cls = '';
    if (/^[①-⑳㉑-㉟]/.test(s)) cls = 'l1';
    else if (/^\d+(의\d+)?\.\s/.test(s)) cls = 'l2';
    else if (/^[가-하]\.\s/.test(s)) cls = 'l3';
    else if (/^\d+\)\s/.test(s)) cls = 'l4';
    let h = esc(s);
    h = h.replace(/(&lt;(?:개정|신설|삭제|전문개정|본조신설|제목개정|종전)[^&]*?&gt;|\[(?:본조신설|전문개정|제목개정|종전|시행일)[^\]]*\])/g, '<span class="amend">$1</span>');
    if (terms && terms.length) h = mark(h, terms);
    return `<p class="${cls}">${h}</p>`;
  }).join('');
}
function mark(html, terms) {
  const t = terms.filter(Boolean).map((x) => esc(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!t.length) return html;
  const re = new RegExp(`(${t.join('|')})`, 'gi');
  return html.split(/(<[^>]+>)/).map((part) => part.startsWith('<') ? part : part.replace(re, '<mark>$1</mark>')).join('');
}

      body.innerHTML = `<div class="res" id="jumpres"><div class="h"><span class="an">${esc(r.law.name)}</span></div><div class="sn">법령 전체 보기</div></div>`;
      $('#jumpres').onclick = () => { addRecent(q); location.hash = `#/law/${r.law.id}`; };
      if (enter) location.hash = `#/law/${r.law.id}`;
      return;
    }
  }
  // 2) 전문 검색
  const scope = r ? [r.law] : D.index.laws;
  const terms = (r ? r.rest : q).split(/\s+/).filter(Boolean);
  const need = scope.filter((l) => !D.laws.has(l.id));
  if (need.length) {
    body.innerHTML = `<div class="note">법령 본문을 불러오는 중… (처음 한 번만)</div><div class="progress"><i id="pg"></i></div>`;
    if (r) { try { await loadLaw(r.law.id); } catch {} }
    else await loadAll((p) => { const pg = $('#pg'); if (pg) pg.style.width = (p * 100).toFixed(0) + '%'; });
    if (seq !== searchSeq) return;
  }
  const res = [];
  const lt = terms.map((t) => t.toLowerCase());
  for (const meta of scope) {
    const law = D.laws.get(meta.id); if (!law) continue;
    for (const a of law.items) {
      if (a.t !== 'a') continue;
      const hay = (a.title + '\n' + a.x).toLowerCase();
      if (!lt.every((t) => hay.includes(t) || nz(a.n) === nz(t))) continue;
      let score = 0;
      for (const t of lt) { if (a.title.toLowerCase().includes(t)) score += 5; score += Math.min(3, hay.split(t).length - 1); }
      res.push({ law, a, score });
    }
  }
  res.sort((x, y) => y.score - x.score);
  if (seq !== searchSeq) return;
  const top = res.slice(0, 200);
  const online = navigator.onLine && !OFFLINE_FILE;
  let h = `<div class="section-t">${r ? esc(r.law.name) + ' 안에서 ' : ''}'${esc(terms.join(' '))}' 검색 결과 ${res.length.toLocaleString()}건${res.length > 200 ? ' (상위 200건)' : ''}</div>`;
  if (!top.length) h += `<div class="empty"><div class="big">🔍</div>담아둔 법령에서는 찾지 못했어요.${online ? `<br><br><a href="https://www.law.go.kr/lsSc.do?menuId=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">법제처에서 '${esc(q)}' 찾아보기 ↗</a>` : ''}</div>`;
  h += top.map(({ law, a }) => {
    const plain = a.x.replace(/^제\d+조(?:의\d+)?\s*\([^)]*\)\s*/, '');
    const low = plain.toLowerCase();
    const at = Math.max(0, low.indexOf(lt[0]) - 40);
    const snip = (at > 0 ? '…' : '') + plain.slice(at, at + 180).replace(/\n/g, ' ');
    return `<div class="res" data-href="#/law/${law.id}/${encodeURIComponent(a.n)}" data-q="${esc(terms.join(' '))}">
      <div class="h"><span class="an">${esc(a.n)}</span><span>${mark(esc(a.title), terms)}</span><span class="ln">${esc(law.name)}</span></div>
      <div class="sn">${mark(esc(snip), terms)}</div></div>`;
  }).join('');
  if (top.length && online) h += `<div class="foot"><a href="https://www.law.go.kr/lsSc.do?menuId=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">담아두지 않은 법령까지 법제처에서 찾기 ↗</a></div>`;
  body.innerHTML = h;
  body.querySelectorAll('.res').forEach((el) => el.onclick = () => { addRecent(q); sessionStorage.setItem('bd.hl', el.dataset.q); location.hash = el.dataset.href; });
}

/* ───── 화면: 법령 본문 ───── */
async function renderLaw(id, target) {
  const meta = lawMeta(id);
  if (!meta) { app.innerHTML = `<div class="empty"><div class="big">🤔</div>이 법령은 목록에 없어요.<br><a href="#/">처음으로</a></div>`; return; }
  app.innerHTML = `<div class="note" style="margin-top:20px">${esc(meta.name)} 불러오는 중…</div>`;
  let law;
  try { law = await loadLaw(id); } catch (e) {
    app.innerHTML = `<div class="empty"><div class="big">📡</div>${esc(e.message)}<br>인터넷이 없을 때는 미리 한 번 열어본 법령만 보여요.<br><a href="#/">처음으로</a></div>`; return;
  }
  const hl = (sessionStorage.getItem('bd.hl') || '').split(/\s+/).filter(Boolean);
  sessionStorage.removeItem('bd.hl');
  const online = navigator.onLine && !OFFLINE_FILE;
  let toc = '', arts = '';
  for (const it of law.items) {
    if (it.t === 'h') {
      const hid = 'h-' + toc.length;
      toc += `<a class="h" href="#" data-go="${hid}">${esc(it.x)}</a>`;
      arts += `<div class="hd" id="${hid}">${esc(it.x)}</div>`;
    } else {
      const bmk = favOf(law.id, it.n);
      toc += `<a href="#" class="${bmk ? 'bmk' : ''}" data-go="a-${esc(it.n)}">${esc(it.n)} ${esc(it.title)}</a>`;
      arts += `<article class="art ${bmk ? 'bm' : ''}" id="a-${esc(it.n)}" data-n="${esc(it.n)}">
        <div class="ah"><span class="lb">${esc(it.n)}</span><span class="tt">${it.title ? '(' + esc(it.title) + ')' : ''}</span>
          <span class="acts">
            <button data-act="bm" class="${bmk ? 'on' : ''}" title="책갈피" aria-label="책갈피">${bmk ? ICON.bmOn : ICON.bm}</button>
            <button data-act="copy" title="조문 복사" aria-label="조문 복사">${ICON.copy}</button>
            ${online ? `<button data-act="link" title="법제처 원문" aria-label="법제처 원문">${ICON.link}</button>` : ''}
          </span></div>
        ${bmk && bmk.memo ? `<div class="bmk-memo">🔖 ${esc(bmk.memo)}</div>` : ''}
        <div class="body">${bodyHTML(it.x, hl)}</div>
      </article>`;
    }
  }
  const fs = store.get('fs', 16);
  document.documentElement.style.setProperty('--fs', fs + 'px');
  app.innerHTML = `
    <div class="lawview">
      <nav class="toc" id="toc">${toc}</nav>
      <div>
        <div class="lawhead" style="padding-top:2px">
          <button class="back" id="back">← 목록·검색</button>
          <h1>${esc(law.name)}</h1>
          <div class="mt"><span class="kind ${esc(law.kind)}">${esc(law.kind || '법령')}</span>
            <span>시행 ${fmtD(law.effective)}</span><span>공포 ${fmtD(law.promulgated)}</span>
            ${law.dept ? `<span>${esc(law.dept)}</span>` : ''}<span>${law.items.filter((i) => i.t === 'a').length}개 조문</span>
            ${online ? `<a href="${lawGoKr(law.name)}" target="_blank" rel="noopener">법제처 원문 ↗</a>` : ''}</div>
        </div>
        <div class="tools">
          <button class="iconbtn tocbtn" id="tocBtn">목차</button>
          <input class="jump" id="jump" inputmode="numeric" placeholder="조 번호" aria-label="조 번호로 이동">
          <input class="find" id="find" type="search" placeholder="이 법령 안에서 찾기" value="${esc(hl.join(' '))}" aria-label="이 법령 안에서 찾기">
          <span class="cnt" id="cnt"></span>
          <button class="iconbtn" id="fsDown" title="글자 작게">가−</button>
          <button class="iconbtn" id="fsUp" title="글자 크게">가+</button>
        </div>
        <div id="arts">${arts}</div>
      </div>
    </div>`;
  for (const el of app.querySelectorAll('.art')) applyHls(el.querySelector('.body'), law.id, el.dataset.n);
  setupHighlighter(law);
  const tocEl = $('#toc');
  $('#back').onclick = () => history.length > 1 ? history.back() : (location.hash = '#/');
  $('#tocBtn').onclick = () => tocEl.classList.toggle('open');
  tocEl.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-go]'); if (!a) return;
    e.preventDefault(); tocEl.classList.remove('open'); scrollToEl(document.getElementById(a.dataset.go));
  });
  $('#jump').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const m = e.target.value.replace(/\s/g, '').match(/^제?(\d+)조?(?:의(\d+))?$/);
    if (!m) return toast('예: 22 또는 22의2');
    const n = `제${m[1]}조${m[2] ? '의' + m[2] : ''}`;
    const el = document.getElementById('a-' + n);
    if (el) { scrollToEl(el, true); history.replaceState(null, '', `#/law/${id}/${encodeURIComponent(n)}`); } else toast(`${n}는 없어요`);
  });
  const setFs = (v) => { v = Math.max(13, Math.min(22, v)); store.set('fs', v); document.documentElement.style.setProperty('--fs', v + 'px'); };
  $('#fsDown').onclick = () => setFs(store.get('fs', 16) - 1);
  $('#fsUp').onclick = () => setFs(store.get('fs', 16) + 1);
  // 법령 안 찾기
  let ft;
  const findInp = $('#find');
  const runFind = () => {
    const terms = findInp.value.trim().split(/\s+/).filter(Boolean);
    let n = 0, first = null;
    for (const el of app.querySelectorAll('.art')) {
      const it = law.items.find((x) => x.t === 'a' && x.n === el.dataset.n);
      el.querySelector('.body').innerHTML = bodyHTML(it.x, terms);
      applyHls(el.querySelector('.body'), law.id, it.n);
      const c = el.querySelectorAll('mark').length; n += c;
      if (c && !first) first = el;
    }
    $('#cnt').textContent = terms.length ? `${n}곳` : '';
    return first;
  };
  findInp.addEventListener('input', () => { clearTimeout(ft); ft = setTimeout(runFind, 250); });
  findInp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const marks = [...app.querySelectorAll('#arts mark')];
    if (!marks.length) return;
    const y = 130;
    const next = marks.find((m) => m.getBoundingClientRect().top > y + 4) || marks[0];
    window.scrollTo({ top: scrollY + next.getBoundingClientRect().top - y - 20, behavior: 'smooth' });
  });
  if (hl.length) $('#cnt').textContent = `${app.querySelectorAll('#arts mark').length}곳`;
  // 조문 버튼
  $('#arts').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const art = b.closest('.art'); const it = law.items.find((x) => x.t === 'a' && x.n === art.dataset.n);
    if (b.dataset.act === 'bm') {
      const had = favOf(law.id, it.n);
      art.querySelector('.bmk-memo')?.remove();
      if (had) { removeBookmark(law.id, it.n); toast('책갈피를 뺐어요'); }
      else {
        const memo = prompt(`${it.n} 책갈피 메모 (비워둬도 돼요)`, '');
        if (memo === null) return;
        addBookmark(law, it, memo.trim());
        if (memo.trim()) art.querySelector('.ah').insertAdjacentHTML('afterend', `<div class="bmk-memo">🔖 ${esc(memo.trim())}</div>`);
        toast('책갈피를 꽂았어요');
      }
      const on = !had;
      b.classList.toggle('on', on); b.innerHTML = on ? ICON.bmOn : ICON.bm; art.classList.toggle('bm', on);
      const ta = app.querySelector(`#toc a[data-go="a-${CSS.escape(it.n)}"]`); if (ta) ta.classList.toggle('bmk', on);
    }
    if (b.dataset.act === 'copy') copyText(`「${law.name}」 ${it.n}${it.title ? '(' + it.title + ')' : ''}\n` + it.x.split('\n').map((l, i) => i === 0 ? l.replace(/^제\d+조(?:의\d+)?\s*\([^)]*\)\s*/, '') : l).filter(Boolean).join('\n'));
    if (b.dataset.act === 'link') window.open(lawGoKr(law.name, it.n), '_blank', 'noopener');
  });
  // 최근 본 법령
  store.set('recent', [id, ...store.get('recent', []).filter((x) => x !== id)].slice(0, 10));
  if (target) {
    const el = document.getElementById('a-' + target);
    if (el) requestAnimationFrame(() => scrollToEl(el, true));
    else toast(`${target}는 이 법령에 없어요`);
  } else window.scrollTo(0, 0);
}
/* ───── 형광펜 도구 ───── */
const hlbar = document.createElement('div');
hlbar.className = 'hlbar'; hlbar.setAttribute('role', 'toolbar');
document.body.appendChild(hlbar);
let hlState = null; // {mode:'new', el, s, e, n} | {mode:'edit', id}
let hlLaw = null;
function hideBar() { hlbar.classList.remove('on'); hlState = null; }
function showBar(rect, mode) {
  hlbar.innerHTML = ['y', 'g', 'p', 'b'].map((c) => `<button class="sw ${c}" data-c="${c}" title="${HL_NAME[c]}" aria-label="${HL_NAME[c]} 형광펜"></button>`).join('')
    + `<button class="sw u" data-c="u" title="밑줄" aria-label="밑줄">가</button><span class="sep"></span>`
    + (mode === 'edit' ? `<button class="t" data-a="del">지우기</button>` : `<button class="t" data-a="copy">복사</button>`)
    + `<button class="t" data-a="close" aria-label="닫기">✕</button>`;
  hlbar.classList.add('on');
  const bw = hlbar.offsetWidth, bh = hlbar.offsetHeight;
  let x = rect.left + rect.width / 2 - bw / 2, y = rect.top - bh - 10;
  if (y < 64) y = rect.bottom + 10;
  hlbar.style.left = Math.max(8, Math.min(innerWidth - bw - 8, x)) + 'px';
  hlbar.style.top = y + 'px';
}
function rerenderArt(n) {
  const el = app.querySelector(`.art[data-n="${CSS.escape(n)}"]`); if (!el || !hlLaw) return;
  const it = hlLaw.items.find((x) => x.t === 'a' && x.n === n);
  const terms = ($('#find')?.value || '').trim().split(/\s+/).filter(Boolean);
  const body = el.querySelector('.body'); body.innerHTML = bodyHTML(it.x, terms); applyHls(body, hlLaw.id, n);
}
hlbar.addEventListener('pointerdown', (e) => e.preventDefault()); // 선택 유지
hlbar.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || !hlState) return;
  const st = hlState;
  if (b.dataset.a === 'close') { getSelection().removeAllRanges(); return hideBar(); }
  if (b.dataset.a === 'copy') { copyText(st.q); getSelection().removeAllRanges(); return hideBar(); }
  if (b.dataset.a === 'del') {
    const h = hls().find((x) => x.id === st.id); saveHls(hls().filter((x) => x.id !== st.id));
    if (h) rerenderArt(h.n); toast('형광펜을 지웠어요'); return hideBar();
  }
  const c = b.dataset.c; if (!c) return;
  if (st.mode === 'edit') {
    const a = hls(); const h = a.find((x) => x.id === st.id); if (h) { h.c = c; saveHls(a); rerenderArt(h.n); }
  } else {
    const it = hlLaw.items.find((x) => x.t === 'a' && x.n === st.n);
    const a = hls();
    a.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), law: hlLaw.id, name: hlLaw.name, n: st.n, title: it ? it.title : '', s: st.s, e: st.e, q: st.q, c, at: Date.now() });
    saveHls(a); getSelection().removeAllRanges(); rerenderArt(st.n);
    toast(`${HL_NAME[c]}${c === 'u' ? '' : ' 형광펜'}으로 표시했어요`);
  }
  hideBar();
});
let selT;
function onSel() {
  if (!hlLaw || !location.hash.startsWith('#/law/')) return;
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { if (hlState && hlState.mode === 'new') hideBar(); return; }
  const r = sel.getRangeAt(0);
  const el = (r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement)?.closest('.art .body');
  if (!el) { const a = sel.anchorNode?.parentElement?.closest('.art .body'); if (a) toast('한 조문 안에서만 칠할 수 있어요'); return; }
  const s = rangeOffset(el, r.startContainer, r.startOffset), e = rangeOffset(el, r.endContainer, r.endOffset);
  const q = el.textContent.slice(s, e);
  if (!q.trim()) return;
  hlState = { mode: 'new', s, e, q, n: el.closest('.art').dataset.n };
  showBar(r.getBoundingClientRect(), 'new');
}
document.addEventListener('selectionchange', () => { clearTimeout(selT); selT = setTimeout(onSel, 220); });
document.addEventListener('scroll', () => { if (hlState && hlState.mode === 'edit') hideBar(); }, { passive: true });
addEventListener('hashchange', hideBar);
function setupHighlighter(law) {
  hlLaw = law;
  $('#arts').addEventListener('click', (e) => {
    const sp = e.target.closest('.hlm'); if (!sp) return;
    if (!getSelection().isCollapsed) return;
    const h = hls().find((x) => x.id === sp.dataset.hid); if (!h) return;
    hlState = { mode: 'edit', id: h.id };
    showBar(sp.getBoundingClientRect(), 'edit');
  });
}

function scrollToEl(el, flash) {
  if (!el) return;
  const y = el.getBoundingClientRect().top + scrollY - 118;
  window.scrollTo({ top: y, behavior: 'auto' });
  if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

/* ───── 라우터 ───── */
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  const p = h.split('/').filter(Boolean);
  if (p[0] === 'law' && p[1]) return renderLaw(p[1], p.slice(2).join('/') || null);
  if (p[0] === 'search') return renderHome(p.slice(1).join('/'));
  window.scrollTo(0, 0);
  return renderHome('');
}
addEventListener('hashchange', route);

(async () => {
  try { await loadIndex(); }
  catch (e) {
    app.innerHTML = `<div class="empty"><div class="big">📡</div>법령 목록을 불러오지 못했어요.<br>인터넷 연결을 확인하거나, 오프라인 파일(부동산신탁_관계법령_오프라인.html)을 열어 주세요.</div>`;
    return;
  }
  setStatus();
  route();
  if (!OFFLINE_FILE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
</body>
