name: 법령 자동 수집

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 오전 6시 17분(한국시간)
  workflow_dispatch:          # Actions 화면에서 'Run workflow'로 바로 실행
    inputs:
      force:
        description: '모든 법령을 처음부터 다시 받기'
        type: boolean
        default: false
  push:
    paths:
      - 'laws.config.json'    # 법령 목록을 바꾸면 바로 수집

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 법령 받기
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: node scripts/collect.mjs ${{ inputs.force && '--force' || '' }}
      - name: 바뀐 내용 저장
        run: |
          git config user.name "beopdaero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data offline.html
          if git diff --cached --quiet; then
            echo "바뀐 법령 없음"
          else
            git commit -m "법령 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
